name: Examples

# Smoke-tests the API examples catalog and the sample apps. Runs only when
# they (or the code that embeds them) change; `cargo test` in CI covers the
# catalog's structure on every pull request.
on:
  push:
    branches: [main]
    paths:
      - examples/apis/**
      - examples/apps/**
      - crates/mockingbird/src/examples.rs
      - scripts/smoke-examples.sh
      - .github/workflows/examples.yml
  pull_request:
    paths:
      - examples/apis/**
      - examples/apps/**
      - crates/mockingbird/src/examples.rs
      - scripts/smoke-examples.sh
      - .github/workflows/examples.yml
  workflow_dispatch:

concurrency:
  group: examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: examples
      # The slim binary: no Kafka (librdkafka) needed, and the console's
      # placeholder page is enough here.
      - run: cargo build -p mockingbird-cli --locked
      - uses: actions/upload-artifact@v7
        with:
          name: mockingbird
          path: target/debug/mockingbird
          retention-days: 1

  smoke:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      GRPCURL_VERSION: 1.9.3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mockingbird
          path: bin
      - name: Install grpcurl
        run: |
          curl -fsSL "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin grpcurl
      - run: chmod +x bin/mockingbird
      - name: validate, serve --offline and one request per example
        run: scripts/smoke-examples.sh bin/mockingbird

  apps:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mockingbird
          path: bin
      - run: chmod +x bin/mockingbird && echo "MOCKINGBIRD_BIN=$PWD/bin/mockingbird" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: fastapi-stripe
        working-directory: examples/apps/fastapi-stripe
        run: |
          python -m pip install -q -r requirements.txt
          python -m pytest -q
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache-dependency-path: examples/apps/go-github/go.sum
      - name: go-github
        working-directory: examples/apps/go-github
        run: go test -v ./...
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: node-shopify-stripe
        working-directory: examples/apps/node-shopify-stripe
        run: |
          npm ci --no-audit --no-fund
          npm test
