name: Release

# A `v*` tag publishes a release: signed multi-arch images (full and slim),
# binaries for five targets, a CycloneDX SBOM, SLSA build provenance, the Helm
# chart (once it exists), the `mb-ext` crate and the GitHub release.
#
# A manual run is a dry run by default: everything is built, scanned and
# packaged, but nothing is pushed, signed, attested or published.
#
# Linux jobs run on the runners named by the CI_RUNNER, CI_RUNNER_LARGE and
# CI_RUNNER_LARGE_ARM repository variables (Blacksmith), falling back to
# GitHub-hosted runners; macOS and Windows builds stay on GitHub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check everything, but push and publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the release version
        id: version
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag=$REF_NAME
          elif [ "$DRY_RUN" = true ]; then
            # A dry run from a branch checks the workspace version.
            tag="v$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          else
            echo "::error::a release that publishes must run from a v* tag"
            exit 1
          fi
          version=${tag#v}
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          if [ "$DRY_RUN" = true ]; then publish=false; else publish=true; fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
            echo "image=ghcr.io/${OWNER,,}/mockingbird"
          } >> "$GITHUB_OUTPUT"
          echo "Release $tag (prerelease: $prerelease, publish: $publish)" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the tag against the workspace, chart and changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: scripts/check-version.sh "$TAG"

  console:
    needs: verify
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mb-console/web/package-lock.json
      - run: npm --prefix crates/mb-console/web ci && npm --prefix crates/mb-console/web run build
      - uses: actions/upload-artifact@v7
        with:
          name: console-dist
          path: crates/mb-console/dist
          if-no-files-found: error

  binaries:
    needs: [verify, console]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ${{ vars.CI_RUNNER_LARGE || 'ubuntu-24.04' }}
            zigbuild: true
          - target: aarch64-unknown-linux-musl
            runner: ${{ vars.CI_RUNNER_LARGE || 'ubuntu-24.04' }}
            zigbuild: true
          - target: aarch64-apple-darwin
            runner: macos-14
            zigbuild: false
          # macos-13 (the last Intel image) was retired 2025-12-04. Apple
          # Silicon runners cross-build x86_64 natively through Xcode.
          - target: x86_64-apple-darwin
            runner: macos-15
            zigbuild: false
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            zigbuild: false
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # The binary embeds the console build instead of its placeholder page.
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: crates/mb-console/dist
      - name: Install the toolchain (rust-toolchain.toml) and the target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      # A tag's caches are visible only to runs of that tag, so only runs on
      # main (manual dry runs) save; tag runs read what main saved.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: matrix.zigbuild
        uses: mlugg/setup-zig@v2
      - if: matrix.zigbuild
        run: cargo install cargo-zigbuild --version '~0.20' --locked
      # Default features (mqtt, amqp). Kafka ships only in the full image.
      - name: Build (cargo zigbuild)
        if: matrix.zigbuild
        run: cargo zigbuild --release --locked -p mockingbird-cli --target "$TARGET"
      - name: Build (cargo build)
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release --locked -p mockingbird-cli --target "$TARGET"
      - name: Package
        run: |
          name="mockingbird-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          exe=mockingbird
          case "$TARGET" in *windows*) exe=mockingbird.exe ;; esac
          cp "target/$TARGET/release/$exe" LICENSE-MIT LICENSE-APACHE README.md CHANGELOG.md "dist/$name/"
          cd dist
          case "$TARGET" in
            *windows*) archive="$name.zip"; 7z a -tzip "$archive" "$name" > /dev/null ;;
            *) archive="$name.tar.gz"; tar -czf "$archive" "$name" ;;
          esac
          rm -rf "$name"
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
      - if: needs.verify.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  sbom:
    needs: verify
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Write the CycloneDX SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --all-features --target all
          # cargo-cyclonedx writes one BOM per package, next to its manifest.
          bom=$(find crates/mockingbird -maxdepth 1 -name '*.cdx.json' | head -n 1)
          if [ -z "$bom" ]; then
            echo "::error::cargo cyclonedx wrote no BOM for crates/mockingbird"
            exit 1
          fi
          cp "$bom" "mockingbird-$VERSION.cdx.json"
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: mockingbird-${{ needs.verify.outputs.version }}.cdx.json
          if-no-files-found: error

  images:
    needs: verify
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: "${{ vars.CI_RUNNER_LARGE || 'ubuntu-24.04' }}" }
          - { arch: arm64, runner: "${{ vars.CI_RUNNER_LARGE_ARM || 'ubuntu-24.04-arm' }}" }
        flavor: [full, slim]
    env:
      IMAGE: ${{ needs.verify.outputs.image }}
      PUBLISH: ${{ needs.verify.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: needs.verify.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            FEATURES=${{ matrix.flavor == 'slim' && '--no-default-features' || '--features full' }}
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ needs.verify.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ needs.verify.outputs.publish }}
          cache-from: type=gha,scope=release-${{ matrix.flavor }}-${{ matrix.platform.arch }}
          # Saved only from main, for the same reason as rust-cache above.
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope=release-{0}-{1}', matrix.flavor, matrix.platform.arch) || '' }}
      # A dry run pushes nothing, so the scan reads the image from the local
      # daemon instead (the build above is cached).
      - name: Load the image for scanning (dry run)
        if: needs.verify.outputs.publish != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            FEATURES=${{ matrix.flavor == 'slim' && '--no-default-features' || '--features full' }}
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
          load: true
          tags: mockingbird:scan
          cache-from: type=gha,scope=release-${{ matrix.flavor }}-${{ matrix.platform.arch }}
      # A digest pushed by this job is a single-platform index; without a
      # platform Trivy looks for linux/amd64 in it and fails on arm64.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.platform.arch }}
        with:
          version: v0.75.0
          image-ref: ${{ needs.verify.outputs.publish == 'true' && format('{0}@{1}', needs.verify.outputs.image, steps.build.outputs.digest) || 'mockingbird:scan' }}
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.flavor }}-${{ matrix.platform.arch }}
          path: digests/*
          if-no-files-found: error

  manifest:
    needs: [verify, images, sbom]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ needs.verify.outputs.image }}
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-full-*
          path: digests/full
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-slim-*
          path: digests/slim
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sbom
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch manifests
        id: manifests
        run: |
          for flavor in full slim; do
            suffix=""
            [ "$flavor" = slim ] && suffix="-slim"
            tags=(-t "$IMAGE:$VERSION$suffix")
            # `latest` only for a final release (no `-` in the tag).
            [ "$PRERELEASE" = false ] && tags+=(-t "$IMAGE:latest$suffix")
            sources=()
            for digest in digests/$flavor/*; do
              sources+=("$IMAGE@sha256:$(basename "$digest")")
            done
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
            digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION$suffix" --format '{{json .Manifest}}' | jq -r .digest)
            echo "$flavor=$digest" >> "$GITHUB_OUTPUT"
          done
      - uses: sigstore/cosign-installer@v3
      - name: Sign the manifests (keyless)
        env:
          FULL: ${{ steps.manifests.outputs.full }}
          SLIM: ${{ steps.manifests.outputs.slim }}
        run: |
          cosign sign --yes "$IMAGE@$FULL"
          cosign sign --yes "$IMAGE@$SLIM"
      - name: Build provenance (full)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.verify.outputs.image }}
          subject-digest: ${{ steps.manifests.outputs.full }}
          push-to-registry: true
      - name: Build provenance (slim)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.verify.outputs.image }}
          subject-digest: ${{ steps.manifests.outputs.slim }}
          push-to-registry: true
      - name: SBOM attestation (full)
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ needs.verify.outputs.image }}
          subject-digest: ${{ steps.manifests.outputs.full }}
          sbom-path: mockingbird-${{ needs.verify.outputs.version }}.cdx.json
          push-to-registry: true
      - name: SBOM attestation (slim)
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ needs.verify.outputs.image }}
          subject-digest: ${{ steps.manifests.outputs.slim }}
          sbom-path: mockingbird-${{ needs.verify.outputs.version }}.cdx.json
          push-to-registry: true

  chart:
    needs: [verify, manifest]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
      - name: Look for the chart
        id: chart
        run: |
          if [ -d deploy/helm/mockingbird ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::deploy/helm/mockingbird does not exist; no chart is published"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.chart.outputs.exists == 'true'
        uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - if: steps.chart.outputs.exists == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.chart.outputs.exists == 'true'
        uses: sigstore/cosign-installer@v3
      - name: Package, push and sign the chart
        if: steps.chart.outputs.exists == 'true'
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry="ghcr.io/${OWNER,,}/charts"
          printf '%s' "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm package deploy/helm/mockingbird --destination chart-dist
          output=$(helm push chart-dist/mockingbird-*.tgz "oci://$registry" 2>&1)
          echo "$output"
          digest=$(printf '%s\n' "$output" | sed -n 's/^Digest: *//p')
          if [ -z "$digest" ]; then
            echo "::error::helm push printed no digest"
            exit 1
          fi
          cosign sign --yes "$registry/mockingbird@$digest"

  release:
    needs: [verify, binaries, sbom, manifest, chart]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          (cd dist && cat *.sha256 > SHA256SUMS)
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" --verify-tag --title "$TAG" "${flags[@]}" \
            --notes-file <(scripts/changelog-section.sh "$VERSION") \
            dist/*.tar.gz dist/*.zip dist/*.sha256 dist/SHA256SUMS "dist/mockingbird-$VERSION.cdx.json"

  # Updates Formula/mockingbird.rb in RJ-s-Org/homebrew-tap. Skipped (with a
  # notice) until the HOMEBREW_TAP_TOKEN secret exists: a fine-grained token
  # with contents write on that repository only. See docs/launch/checklist.md.
  homebrew:
    needs: [verify, release]
    if: needs.verify.outputs.publish == 'true' && needs.verify.outputs.prerelease == 'false'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - name: Render the formula and push it to the tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the Homebrew tap was not updated"
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          scripts/render-packaging.sh "$VERSION" "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/packaging"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/RJ-s-Org/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          cp "$RUNNER_TEMP/packaging/homebrew/mockingbird.rb" "$RUNNER_TEMP/tap/Formula/mockingbird.rb"
          cd "$RUNNER_TEMP/tap"
          git add Formula/mockingbird.rb
          if git diff --cached --quiet; then
            echo "::notice::the tap already has mockingbird $VERSION"
            exit 0
          fi
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -m "mockingbird $VERSION"
          git push origin HEAD

  # crates.io versions cannot be deleted, so a prerelease leaves mb-ext alone.
  publish-crate:
    needs: [verify, release]
    if: needs.verify.outputs.publish == 'true' && needs.verify.outputs.prerelease == 'false'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Publish mb-ext unless this version is on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mb-ext") | .version')
          # Outside the workspace, `cargo info` asks crates.io rather than
          # describing the local package.
          if (cd "$RUNNER_TEMP" && cargo info "mb-ext@$version" --registry crates-io > /dev/null 2>&1); then
            echo "::notice::mb-ext $version is already on crates.io; skipping"
            exit 0
          fi
          cargo publish -p mb-ext --locked

  # `mockingbird-cli` (the `mockingbird` binary) and the internal crates it
  # depends on (`mockingbird-engine`, … from crates/mb-*), published together
  # in dependency order at the workspace version, after mb-ext. The
  # package carries the built console, the example catalog and the agent
  # skills (crates/mockingbird/build.rs). A dry run packages and verifies all
  # of them without uploading; a prerelease publishes nothing.
  publish-cli:
    needs: [verify, console, release, publish-crate]
    if: >-
      always() && needs.verify.result == 'success' && needs.console.result == 'success' &&
      (needs.verify.outputs.publish == 'false' ||
       (needs.verify.outputs.prerelease == 'false' && needs.publish-crate.result == 'success'))
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: crates/mb-console/dist
      - name: Put the example catalog and the skills into the package
        run: |
          mkdir -p crates/mockingbird/embedded
          cp -R examples/apis crates/mockingbird/embedded/examples
          cp -R plugins/mockingbird/skills crates/mockingbird/embedded/skills
      - name: Publish mockingbird-cli and the crates it depends on
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PUBLISH: ${{ needs.verify.outputs.publish }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ "$PUBLISH" != true ]; then
            # mb-ext is packaged too, so the others resolve it locally.
            cargo publish --workspace --dry-run --allow-dirty --locked
            exit 0
          fi
          # Skips crates already on crates.io and waits out its rate limit on
          # new crates; .github/workflows/publish-crates.yml resumes a release
          # whose run gave up.
          scripts/publish-crates.sh

  # The npm packages (npm/): the launcher and one package per target, built
  # from the archives the `binaries` job made. A dry run stops after packing
  # and validating them.
  npm-pack:
    needs: [verify, binaries]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
        working-directory: npm/cli
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Build the packages from the release archives
        run: node npm/scripts/build-packages.mjs --version "$VERSION" --assets dist --out npm/dist
      - name: Pack and check them
        run: |
          # Tarballs are named after their directory (cli.tgz, linux-x64.tgz,
          # ...), whatever the npm scope.
          mkdir npm/tarballs
          for dir in npm/dist/*/; do
            key=$(basename "$dir")
            file=$(cd "$dir" && npm pack --json --pack-destination "$GITHUB_WORKSPACE/npm/tarballs" | jq -r '.[0].filename')
            mv "npm/tarballs/$file" "npm/tarballs/$key.tgz"
            [ "$key" = cli ] && continue
            # Every platform package carries its binary, executable.
            listing=$(tar -tvzf "npm/tarballs/$key.tgz")
            echo "$listing"
            echo "$listing" | grep -Eq '^-rwx.* package/bin/mockingbird(\.exe)?$' \
              || { echo "::error::$key has no executable bin/mockingbird"; exit 1; }
          done
          # The launcher runs the linux-x64 binary from its package.
          dir=$(mktemp -d)
          (cd "$dir" && npm init -y > /dev/null && npm install --no-audit --no-fund \
            "$GITHUB_WORKSPACE/npm/tarballs/cli.tgz" "$GITHUB_WORKSPACE/npm/tarballs/linux-x64.tgz")
          out=$(cd "$dir" && MOCKINGBIRD_NO_DOWNLOAD=1 npx --no-install mockingbird --version)
          echo "$out"
          [ "$out" = "mockingbird $VERSION" ] || { echo "::error::expected 'mockingbird $VERSION'"; exit 1; }
          ls -l npm/tarballs
      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: npm/tarballs/*.tgz
          if-no-files-found: error

  # Publishes to npm after the GitHub release exists (the launcher's download
  # fallback reads its assets), through trusted publishing (OIDC) only: no
  # token. Skipped, with a notice, until the NPM_PUBLISH repository variable
  # is `true`, which is set once every package has its trusted publisher. The
  # first version is published by hand from the npm-packages artifact. See
  # docs/launch/checklist.md.
  npm-publish:
    needs: [verify, npm-pack, release]
    if: needs.verify.outputs.publish == 'true' && github.ref_type == 'tag'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
    steps:
      - name: Check that npm publishing is set up
        id: gate
        run: |
          if [ "$NPM_PUBLISH" != true ]; then
            echo "::notice::the NPM_PUBLISH repository variable is not 'true'; nothing was published to npm"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or later.
      - if: steps.gate.outputs.go == 'true'
        run: npm install -g 'npm@>=11.5.1 <12' && npm --version
      - if: steps.gate.outputs.go == 'true'
        uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: tarballs
      - name: Publish the platform packages, then the launcher
        if: steps.gate.outputs.go == 'true'
        # No token: npm exchanges this job's OIDC token (id-token: write) for
        # a short-lived publish token through each package's trusted publisher.
        run: |
          tag=latest
          [ "$PRERELEASE" = true ] && tag=next
          publish() {
            name=$(tar -xzOf "$1" package/package.json | jq -r .name)
            # A re-run skips what an earlier attempt published.
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "::notice::$name@$VERSION is already on npm; skipping"
              return
            fi
            npm publish "$1" --provenance --access public --tag "$tag"
          }
          # The launcher goes last, so it never points at a missing package.
          for tgz in tarballs/*.tgz; do
            [ "$tgz" = tarballs/cli.tgz ] || publish "$tgz"
          done
          publish tarballs/cli.tgz
