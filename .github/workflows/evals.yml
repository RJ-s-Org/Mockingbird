name: Evals

# Nightly LLM evals against a real provider. Never runs on pull requests:
# it spends tokens and needs the provider secrets.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - name: Run evals
        env:
          MB_EVAL_LLM_BASE_URL: ${{ secrets.MB_EVAL_LLM_BASE_URL }}
          MB_EVAL_LLM_MODEL: ${{ secrets.MB_EVAL_LLM_MODEL }}
          MB_EVAL_LLM_API_KEY: ${{ secrets.MB_EVAL_LLM_API_KEY }}
        run: cargo run --release -p mb-evals -- run --out eval-report
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report/
          if-no-files-found: warn
      - name: Job summary
        if: always()
        run: |
          if [ -f eval-report/report.md ]; then
            cat eval-report/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No eval report was written." >> "$GITHUB_STEP_SUMMARY"
          fi
