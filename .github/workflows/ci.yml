name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR cancels the run it supersedes. Runs on main
# are never cancelled, so every main commit reports a result and saves its
# cache.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER_LARGE || 'ubuntu-latest' }}
    env:
      MB_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      MB_TEST_AMQP_URL: amqp://guest:guest@localhost:5672/%2f
      MB_TEST_KAFKA_URL: localhost:9092
      MB_TEST_REDIS_URL: redis://localhost:6379
      # Every test binary with full debuginfo no longer fits on the runner's
      # disk (rust-lld dies with a bus error while linking).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      # The service containers start in the background (image pulls
      # included) and come up while the toolchain and the build run. "Wait
      # for the service containers" checks each one just before the tests.
      # A `services:` block held the job for about 15 s before checkout
      # (audit CI-4).
      - name: Start the service containers
        run: |
          log="$RUNNER_TEMP/services.log"
          # Each runs detached from the step's output, so the step ends now.
          start() {
            { docker run -d --name "$@" || echo "docker run $1 failed"; } </dev/null >>"$log" 2>&1 &
          }
          start postgres -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16
          start rabbitmq -p 5672:5672 rabbitmq:3
          # KRaft single node with the image's default config.
          start kafka -p 9092:9092 apache/kafka:3.9.1
          start redis -p 6379:6379 redis:7
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      # The console is built first, so mb-console embeds the real build
      # instead of its placeholder page.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mb-console/web/package-lock.json
      - run: npm --prefix crates/mb-console/web ci && npm --prefix crates/mb-console/web run build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      # Every rust-cache step saves only from main and PRs restore main's
      # caches: PR saves (scoped to refs/pull/N/merge, unusable elsewhere)
      # evicted main's at the 10 GB repository limit (audit CI-8).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # librdkafka 2.12 includes <curl/curl.h> even when built without curl.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - name: Wait for the service containers
        timeout-minutes: 4
        run: |
          # ready NAME PROBE...: runs PROBE in the container every 2 s for up
          # to 180 s; on timeout prints the start log and the container's
          # logs and fails.
          ready() {
            name=$1; shift
            for _ in $(seq 1 90); do
              if docker exec "$name" "$@" >/dev/null 2>&1; then echo "$name is ready"; return 0; fi
              sleep 2
            done
            echo "::error::$name was not ready within 180 s"
            cat "$RUNNER_TEMP/services.log" || true
            docker logs --tail 100 "$name" || true
            return 1
          }
          # Over TCP: the image's init-time server listens on the socket only.
          ready postgres pg_isready -h 127.0.0.1 -U postgres
          ready redis redis-cli ping
          ready rabbitmq rabbitmq-diagnostics -q check_port_connectivity
          ready kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
      # Profile and test groups: .config/nextest.toml. nextest skips
      # doctests, so they run on their own.
      - run: cargo nextest run --workspace --all-features --profile ci
      - run: cargo test --doc --workspace --all-features

  # Each mb-protocols feature (and none) must build on its own, warnings
  # included (P4 Global Constraints; P5 adds the event features). One job
  # checks them in turn, so the shared dependencies compile once. It also
  # checks the slim binary and builds the API docs, off the critical path of
  # `check`; RUSTFLAGS denies warnings in every step. No Node: mb-console's
  # build.rs writes a placeholder console page when dist/ is missing.
  protocol-features:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
        with:
          key: protocols
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # librdkafka 2.12 includes <curl/curl.h> even when built without curl.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - name: cargo check -p mockingbird-protocols, each feature on its own
        run: |
          cargo check -p mockingbird-protocols --no-default-features
          for features in http-rest sse websocket graphql grpc soap events mqtt amqp kafka; do
            echo "::group::--features $features"
            cargo check -p mockingbird-protocols --no-default-features --features "$features"
            echo "::endgroup::"
          done
      - name: Check the slim binary
        run: cargo check -p mockingbird-cli --no-default-features
      - name: Build the API docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

  console:
    # Stays on the 2 vCPU runner: console (116-199 s on PRs) finishes before
    # e2e and check, so the large runner would cost more for no shorter run
    # (audit CI-5, measured 2026-10-30).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      # check:api and the local e2e suite only run the binary: without
      # debuginfo it links faster and the cache is smaller.
      CARGO_PROFILE_DEV_DEBUG: "0"
    defaults:
      run:
        working-directory: crates/mb-console/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mb-console/web/package-lock.json
      # check:api and the local e2e suite run the mockingbird binary.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:api
      - run: npx playwright install --with-deps chromium && npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: console-playwright-report
          path: crates/mb-console/web/playwright-report
          if-no-files-found: ignore

  deny:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Lints and renders the Helm chart and validates it with kubeconform.
  helm:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-helm.sh

  # The mb-ext public API against the last release tag.
  semver:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      # Pinned: a new release can change which lints fail. Bump it here; the
      # cache key follows.
      CARGO_SEMVER_CHECKS_VERSION: 0.51.0
    steps:
      - uses: actions/checkout@v7
        with:
          # The baseline is the last `v*` tag, so the history is needed.
          fetch-depth: 0
      # Only mb-ext has a public API to check; skip the build when it has not
      # changed since the last release tag.
      - name: Has mb-ext changed since the last release?
        id: changed
        run: |
          if tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null) \
            && git diff --quiet "$tag" HEAD -- crates/mb-ext; then
            echo "mb-ext is unchanged since $tag; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache cargo-semver-checks
        if: steps.changed.outputs.run == 'true'
        id: semver-checks
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-semver-checks
          key: cargo-semver-checks-${{ env.CARGO_SEMVER_CHECKS_VERSION }}-${{ runner.os }}-rust-1.97
      - name: Install cargo-semver-checks
        if: steps.changed.outputs.run == 'true' && steps.semver-checks.outputs.cache-hit != 'true'
        run: cargo install cargo-semver-checks --version "$CARGO_SEMVER_CHECKS_VERSION" --locked
      - if: steps.changed.outputs.run == 'true'
        run: scripts/semver-check.sh

  # The minimum supported Rust version, built with its own toolchain. Kept
  # separate from `check` so a rust-toolchain.toml bump cannot hide an MSRV
  # regression: `rust-version` in Cargo.toml is the source of truth. While
  # it equals the pinned toolchain, `check` already builds with it and this
  # job stops after the comparison.
  msrv:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Is the MSRV older than the pinned toolchain?
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          pinned=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "rust-version $msrv, rust-toolchain.toml $pinned"
          if [ "$msrv" = "$pinned" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.msrv.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - if: steps.msrv.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # librdkafka 2.12 includes <curl/curl.h> even when built without curl.
      - if: steps.msrv.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - if: steps.msrv.outputs.run == 'true'
        run: cargo +1.97 check --workspace --all-features --locked

  e2e:
    runs-on: ${{ vars.CI_RUNNER_LARGE || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      # Builds the full image once: it is smoke-tested and scanned here, and
      # the Compose services run it (mockingbird:local). The slim image is
      # built by the release workflow; `protocol-features` checks the slim
      # binary.
      - uses: docker/setup-buildx-action@v4
      - name: Build the Mockingbird image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mockingbird:local
          cache-from: type=gha,scope=full
          # Only main writes the cache: a PR's export cost about 30 s, and its
          # entries (scoped to refs/pull/N/merge) only crowded out main's.
          # PRs read main's cache. zstd unpacks faster than gzip.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=full,compression=zstd' || '' }}
      - name: Smoke test
        run: docker run --rm mockingbird:local --version
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: mockingbird:local
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
      - name: Start the Compose stack (Postgres, Rauthy, Mockingbird)
        run: docker compose -f deploy/compose/docker-compose.yml up -d --wait --wait-timeout 300
      - name: Wait for Mockingbird
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:9090/readyz; then exit 0; fi
            sleep 2
          done
          echo "Mockingbird was not ready within 180 s" >&2
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mb-console/web/package-lock.json
      - name: Rauthy login flow
        working-directory: crates/mb-console/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.rauthy.config.ts e2e-rauthy/
      - name: Compose e2e flow
        working-directory: crates/mb-console/web
        run: npx playwright test -c playwright.rauthy.config.ts e2e-compose/flow.spec.ts
      - name: Start the HA profile (control and data node over Postgres and Redis)
        run: docker compose -f deploy/compose/docker-compose.yml --profile ha up -d --wait --wait-timeout 300
      - name: HA path
        run: |
          set -euo pipefail
          control=http://localhost:19090
          data=http://localhost:18080
          # The control node's Admin API may still be starting.
          for _ in $(seq 1 60); do
            if curl -fsS "$control/readyz" >/dev/null; then break; fi
            sleep 2
          done
          # 1. Create a mock through the control node's admin port.
          curl -fsS -X POST "$control/api/v1/mocks" \
            -H 'content-type: application/json' -d '{"name":"ha"}'
          curl -fsS -X POST "$control/api/v1/mocks/ha/contracts" \
            -H 'content-type: application/yaml' \
            --data-binary @fixtures/openapi/orders-3.0.yaml
          # 2. The data node serves it within 30 s.
          served=0
          for _ in $(seq 1 30); do
            if curl -fsS "$data/ha/orders/o1" >/dev/null; then served=1; break; fi
            sleep 1
          done
          if [ "$served" -ne 1 ]; then
            echo "the data node did not serve the mock within 30 s" >&2
            exit 1
          fi
          # 3. With the control node stopped, the data node still serves.
          docker compose -f deploy/compose/docker-compose.yml --profile ha stop mockingbird-control
          curl -fsS "$data/ha/orders/o1"
      - name: Compose logs
        if: failure()
        run: |
          docker compose -f deploy/compose/docker-compose.yml --profile ha ps -a
          for service in rauthy rauthy-bootstrap mockingbird postgres mockingbird-control mockingbird-data postgres-ha redis; do
            echo "::group::$service logs"
            docker compose -f deploy/compose/docker-compose.yml --profile ha logs --no-color --timestamps "$service"
            echo "::endgroup::"
          done
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml --profile ha down -v
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rauthy-playwright-report
          path: crates/mb-console/web/playwright-report
          if-no-files-found: ignore
