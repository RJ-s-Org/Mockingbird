name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MB_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # The console is built first, so mb-console embeds the real build
      # instead of its placeholder page.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mb-console/web/package-lock.json
      - run: npm --prefix crates/mb-console/web ci && npm --prefix crates/mb-console/web run build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  # Each mb-protocols feature (and none) must build on its own, warnings
  # included (P4 Global Constraints).
  protocol-features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [none, http-rest, sse, websocket, graphql, grpc, soap]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
        with:
          key: protocols-${{ matrix.features }}
      - name: cargo check -p mb-protocols (${{ matrix.features }})
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          if [ "$FEATURES" = none ]; then
            cargo check -p mb-protocols --no-default-features
          else
            cargo check -p mb-protocols --no-default-features --features "$FEATURES"
          fi

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/mb-console/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mb-console/web/package-lock.json
      # check:api and the local e2e suite run the mockingbird binary.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:api
      - run: npx playwright install --with-deps chromium && npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-playwright-report
          path: crates/mb-console/web/playwright-report
          if-no-files-found: ignore

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mockingbird:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm mockingbird:ci --version

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the Compose stack (Postgres, Rauthy, Mockingbird)
        run: docker compose -f deploy/compose/docker-compose.yml up -d --build --wait --wait-timeout 300
      - name: Wait for Mockingbird
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:9090/readyz; then exit 0; fi
            sleep 2
          done
          echo "Mockingbird was not ready within 180 s" >&2
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mb-console/web/package-lock.json
      - name: Rauthy login flow
        working-directory: crates/mb-console/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.rauthy.config.ts
      - name: Compose logs
        if: failure()
        run: |
          docker compose -f deploy/compose/docker-compose.yml ps -a
          for service in rauthy rauthy-bootstrap mockingbird postgres; do
            echo "::group::$service logs"
            docker compose -f deploy/compose/docker-compose.yml logs --no-color --timestamps "$service"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rauthy-playwright-report
          path: crates/mb-console/web/playwright-report
          if-no-files-found: ignore
