name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
      kafka:
        # KRaft single node with the image's default config.
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
    env:
      MB_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      MB_TEST_AMQP_URL: amqp://guest:guest@localhost:5672/%2f
      MB_TEST_KAFKA_URL: localhost:9092
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Check the slim binary
        run: cargo check -p mockingbird --no-default-features
      - name: Check each mb-protocols feature alone
        run: |
          for f in http-rest sse websocket graphql grpc soap events mqtt amqp kafka; do
            echo "::group::mb-protocols --features $f"
            cargo check -p mb-protocols --no-default-features --features "$f"
            echo "::endgroup::"
          done

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the full image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mockingbird:ci
          cache-from: type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full
      - name: Build the slim image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-args: FEATURES=--no-default-features
          tags: mockingbird:ci-slim
          cache-from: type=gha,scope=slim
          cache-to: type=gha,mode=max,scope=slim
      - name: Smoke test
        run: |
          docker run --rm mockingbird:ci --version
          docker run --rm mockingbird:ci-slim --version
