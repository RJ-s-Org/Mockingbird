name: Docs

# Builds the documentation site (mdBook over docs/) and checks its links on
# every PR that touches the docs. On main it also publishes the site to GitHub
# Pages, but only once Pages is enabled with "GitHub Actions" as its source
# (Settings → Pages → Build and deployment → Source); until then the deploy
# job is skipped. See docs/launch/checklist.md.
on:
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'
      - book.toml
      - scripts/docs-*
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - book.toml
      - scripts/docs-*
      - crates/mb-admin/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: v0.5.4
  LYCHEE_VERSION: v0.24.2

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook and lychee
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/$MDBOOK_VERSION/mdbook-$MDBOOK_VERSION-x86_64-unknown-linux-musl.tar.gz" |
            tar -xz -C "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-$LYCHEE_VERSION/lychee-x86_64-unknown-linux-musl.tar.gz" |
            tar -xz -C "$RUNNER_TEMP/bin" --strip-components=1 lychee-x86_64-unknown-linux-musl/lychee
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the site and check links
        run: scripts/docs-check.sh
      - name: Is GitHub Pages enabled with the Actions source?
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || true)
          if [ "$build_type" = workflow ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled with the GitHub Actions source; the site is built but not deployed"
          fi

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages == 'true'
    runs-on: ${{ vars.CI_RUNNER_LARGE || 'ubuntu-24.04' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/$MDBOOK_VERSION/mdbook-$MDBOOK_VERSION-x86_64-unknown-linux-musl.tar.gz" |
            tar -xz -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs-openapi
      - name: Build the site with the Admin API reference
        run: |
          mdbook build
          cargo run -q --locked -p mockingbird-cli -- openapi > target/book/api/admin-openapi.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/book
      - id: deploy
        uses: actions/deploy-pages@v5
