# A hand-written description of Spotify's token endpoint on accounts.spotify.com
# (client credentials, authorization code and refresh), written for Mockingbird's
# examples and covered by its license. Spotify publishes no spec for it; shapes
# follow https://developer.spotify.com/documentation/web-api/tutorials/client-credentials-flow
# and the OAuth 2.0 token response (RFC 6749).
openapi: 3.1.0
info:
  title: Spotify Accounts service (Mockingbird example subset)
  version: "1.0"
servers:
  - url: https://accounts.spotify.com
paths:
  /api/token:
    post:
      operationId: request-access-token
      summary: Exchange client credentials, an authorization code or a refresh token for an access token.
      security:
        - clientBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [client_credentials, authorization_code, refresh_token] }
                code: { type: string }
                redirect_uri: { type: string }
                refresh_token: { type: string }
                client_id: { type: string }
                code_verifier: { type: string }
      responses:
        "200":
          description: An access token, valid for an hour.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [access_token, token_type, expires_in]
                properties:
                  access_token: { type: string, pattern: "^BQ[A-Za-z0-9_-]{110}$" }
                  token_type: { type: string, const: Bearer }
                  expires_in: { type: integer, const: 3600 }
                  scope: { type: string }
                  refresh_token: { type: string, pattern: "^AQ[A-Za-z0-9_-]{130}$" }
        "400":
          description: A bad grant or request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "401":
          description: Unknown client or wrong secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
components:
  securitySchemes:
    clientBasic:
      type: http
      scheme: basic
      description: base64(client_id:client_secret)
  schemas:
    OAuthError:
      type: object
      required: [error]
      properties:
        error: { type: string, enum: [invalid_client, invalid_grant, invalid_request, unsupported_grant_type] }
        error_description: { type: string }
