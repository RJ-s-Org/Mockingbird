# Shopify Admin GraphQL API 2026-10: shop, products and variants, inventory,
# orders and customers, with productCreate/customerCreate (userErrors) and webhooks.
#   mockingbird serve -c mockingbird.yaml --offline
#   curl -s localhost:8080/admin/api/2026-10/graphql.json -H 'Host: juniper-plants.myshopify.com' \
#     -H 'X-Shopify-Access-Token: shpat_test123' -H 'content-type: application/json' \
#     -d '{"query":"{ shop { name myshopifyDomain currencyCode } }"}'
# Contract: shopify-admin.graphql, a hand-written subset (see its header); Shopify
# publishes no openly licensed schema file, so there is no upstream to pin.
proxy:
  enabled: true          # apps reach https://juniper-plants.myshopify.com through http://127.0.0.1:8888
protocols:
  graphql:
    path: /graphql.json  # Shopify's endpoint is /admin/api/<version>/graphql.json
mocks:
  shopify-admin:
    contract: shopify-admin.graphql
    route_prefix: /admin/api/2026-10
    hosts: [juniper-plants.myshopify.com]
    persona: >-
      Shopify Admin GraphQL API (version 2026-10) for "Juniper Plants", a Portland,
      Oregon houseplant store on the Shopify plan, myshopifyDomain
      juniper-plants.myshopify.com, currency USD, timezone America/Los_Angeles. Ids
      are global ids "gid://shopify/<Type>/<13-digit number>" (Product, ProductVariant,
      InventoryItem, InventoryLevel, Location, Order, Customer, LineItem) and
      legacyResourceId is the same number as a string. Products are plants and pots
      (Fiddle Leaf Fig, Monstera Deliciosa, Snake Plant, terracotta pots) with
      vendor "Juniper Plants", lowercase-hyphen handles and prices like "34.00".
      Orders are named "#1001" upward, with US customers and @example.com emails.
      Locations are "Portland Greenhouse" and "Seattle Warehouse". Money amounts are
      decimal strings and currencyCode is USD. DateTime values are ISO 8601 UTC
      ("2024-10-14T17:03:22Z"). Connections return at most the requested `first`
      items, with matching edges, nodes and cursors. Mutations copy their input into
      the created object and return userErrors as an empty list.
    webhooks:
      # Shopify sends products/create and customers/create to your app's webhook route.
      - url: http://127.0.0.1:3000/webhooks
        events: [Mutation.productCreate, Mutation.customerCreate]
        secret: env:SHOPIFY_WEBHOOK_SECRET
        signing: hmac-sha256    # Shopify signs base64 in X-Shopify-Hmac-Sha256; this is hex in X-Mockingbird-Signature
    scenarios:
      invalid-product:
        # productCreate answers 200 with userErrors, like Shopify does for a blank title.
        operations: [Mutation.productCreate]
        set:
          product: null
          userErrors:
            - __typename: UserError   # objects inside a list need their __typename
              field: [title]
              message: Title can't be blank
      slow:
        # Bulk-ish product and order queries are slow on Shopify; exercise client timeouts.
        latency: 3s
      outage:
        status: 503
