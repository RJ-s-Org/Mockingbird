        - { name: "page[after]", in: query, schema: { type: string } }
        - { name: sort_by, in: query, schema: { type: string, enum: [created_at, updated_at, id, status] } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: external_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of tickets.
          content:
            application/json:
              schema:
                type: object
                required: [tickets, count, next_page, previous_page]
                properties:
                  tickets: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/TicketObject" } }
                  count: { type: integer, minimum: 0, maximum: 5 }
                  next_page: { type: ["null"] }
                  previous_page: { type: ["null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: CreateTicketJson
      summary: Create a ticket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: { $ref: "#/components/schemas/TicketCreateInput" }
      responses:
        "201":
          description: The new ticket and the audit of its creation.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/RecordInvalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v2/tickets/{ticket_id}.json:
    parameters:
      - { name: ticket_id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: ShowTicketJson
      summary: Show one ticket.
      responses:
        "200":
          description: The ticket.
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket: { $ref: "#/components/schemas/TicketObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/RecordNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: UpdateTicketJson
      summary: Update a ticket; a `comment` adds a public reply or internal note.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: { $ref: "#/components/schemas/TicketUpdateInput" }
      responses:
        "200":
          description: The updated ticket and the audit of the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/RecordNotFound" }
        "422": { $ref: "#/components/responses/RecordInvalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v2/tickets/{ticket_id}/comments.json:
    parameters:
      - { name: ticket_id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: ListTicketCommentsJson
      summary: The ticket's comments, oldest first.
      parameters:
        - { name: include_inline_images, in: query, schema: { type: boolean } }
        - { name: include, in: query, schema: { type: string, enum: [users] } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        "200":
          description: The comments.
          content:
            application/json:
              schema:
                type: object
                required: [comments, count, next_page, previous_page]
                properties:
                  comments: { type: array, minItems: 1, maxItems: 4, items: { $ref: "#/components/schemas/TicketCommentObject" } }
                  count: { type: integer, minimum: 1, maximum: 4 }
                  next_page: { type: ["null"] }
                  previous_page: { type: ["null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/RecordNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v2/users.json:
    get:
      operationId: ListUsersJson
      summary: List users.
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [end-user, agent, admin] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema:
                type: object
                required: [users, count, next_page, previous_page]
                properties:
                  users: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/UserObject" } }
                  count: { type: integer, minimum: 0, maximum: 5 }
                  next_page: { type: ["null"] }
                  previous_page: { type: ["null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: CreateUserJson
      summary: Create a user (an end user by default).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
                    email: { type: string, format: email }
                    role: { type: string, enum: [end-user, agent, admin] }
                    phone: { type: string }
                    organization_id: { type: integer }
                    external_id: { type: string }
                    tags: { type: array, items: { type: string } }
                    verified: { type: boolean }
      responses:
        "201":
          description: The new user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/UserObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/RecordInvalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v2/users/me.json:
    get:
      operationId: ShowCurrentUserJson
      summary: The user the credentials belong to.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/UserObject" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v2/users/{user_id}.json:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: ShowUserJson
      summary: Show one user.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/UserObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/RecordNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v2/search.json:
    get:
      operationId: ListSearchResultsJson
      summary: "Search tickets, users and organizations (query syntax: `type:ticket status:open`)."
      parameters:
        - { name: query, in: query, required: true, schema: { type: string } }
        - { name: sort_by, in: query, schema: { type: string, enum: [updated_at, created_at, priority, status, ticket_type] } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: Matching records.
          content:
            application/json:
              schema:
                type: object
                required: [results, count, facets, next_page, previous_page]
                properties:
                  results:
                    type: array
                    maxItems: 5
                    items:
                      allOf:
                        - $ref: "#/components/schemas/TicketObject"
                        - type: object
                          required: [result_type]
                          properties:
                            result_type: { type: string, const: ticket }
                  count: { type: integer, minimum: 0, maximum: 5 }
                  facets: { type: ["null"] }
                  next_page: { type: ["null"] }
                  previous_page: { type: ["null"] }
        "400":
          description: The query is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
webhooks:
  # Mockingbird picks a webhook payload by the event type it derives
  # (ticket.created, ticket.updated); `type` carries Zendesk's event name.
  ticket.created:
    post:
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketCreatedEvent" }
      responses:
        "200": { description: Acknowledged. }
  ticket.updated:
    post:
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketUpdatedEvent" }
      responses:
        "200": { description: Acknowledged. }
  # The .json aliases derive no clean event type, so their payloads are
  # matched by operation id.
  CreateTicketJson:
    post:
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketCreatedEvent" }
      responses:
        "200": { description: Acknowledged. }
  UpdateTicketJson:
    post:
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketUpdatedEvent" }
      responses:
        "200": { description: Acknowledged. }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: "`{email}/token:{api_token}`, or email and password."
    bearerAuth:
      type: http
      scheme: bearer
      description: An OAuth access token.
  responses:
    Unauthorized:
      description: Couldn't authenticate you.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RecordNotFound:
      description: The record does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RecordInvalid:
      description: The record failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited; wait Retry-After seconds.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1, maximum: 60 } }
        ratelimit-remaining: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Zendesk is temporarily unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [RecordNotFound, RecordInvalid, InvalidValue, Unauthorized, TooManyRequests, DatabaseError]
        description: { type: string }
        details:
          type: object
          maxProperties: 1
          additionalProperties:
            type: array
            maxItems: 1
            items:
              type: object
              required: [description, error]
              properties:
                description: { type: string }
                error: { type: string }
    Via:
      type: object
      required: [channel]
      properties:
        channel: { type: string, enum: [web, email, api, chat] }
        source:
          type: object
          properties:
            from: { type: object }
            to: { type: object }
            rel: { type: ["string", "null"] }
    TicketObject:
      type: object
      required: [id, url, subject, raw_subject, description, status, priority, type, requester_id, submitter_id, assignee_id, group_id, tags, via, created_at, updated_at, is_public]
      properties:
        id: { type: integer, minimum: 1000, maximum: 9999 }
        url: { type: string, pattern: "^https://juniper\\.zendesk\\.com/api/v2/tickets/[1-9][0-9]{3}\\.json$" }
        external_id: { type: ["string", "null"] }
        type: { type: ["string", "null"], enum: [problem, incident, question, task, null] }
        subject: { type: string }
        raw_subject: { type: string }
        description: { type: string, description: The first comment. }
        priority: { type: ["string", "null"], enum: [urgent, high, normal, low, null] }
        status: { type: string, enum: [new, open, pending, hold, solved, closed] }
        recipient: { type: ["string", "null"], format: email }
        requester_id: { type: integer, minimum: 360000000000, maximum: 369999999999 }
        submitter_id: { type: integer, minimum: 360000000000, maximum: 369999999999 }
        assignee_id: { type: ["integer", "null"], minimum: 360000000000, maximum: 369999999999 }
        organization_id: { type: ["integer", "null"] }
