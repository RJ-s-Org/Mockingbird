# A hand-written subset of the Zendesk Support API (tickets, ticket comments,
# users, search), written for Mockingbird's examples and covered by its
# license. Paths, operation ids and field names follow Zendesk's published
# OpenAPI description,
#   https://developer.zendesk.com/zendesk/oas.yaml
# which is governed by the Zendesk Developer Terms rather than an open license,
# so none of it is copied here.
openapi: 3.1.0
info:
  title: Zendesk Support API (Mockingbird example subset)
  version: "2.0"
servers:
  - url: https://{subdomain}.zendesk.com
    variables:
      subdomain: { default: juniper }
security:
  - basicAuth: []
  - bearerAuth: []
paths:
  /api/v2/tickets:
    get:
      operationId: ListTickets
      summary: List tickets (offset or cursor pagination).
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: "page[size]", in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: "page[after]", in: query, schema: { type: string } }
        - { name: sort_by, in: query, schema: { type: string, enum: [created_at, updated_at, id, status] } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: external_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of tickets.
          content:
            application/json:
              schema:
                type: object
                required: [tickets, count, next_page, previous_page]
                properties:
                  tickets: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/TicketObject" } }
                  count: { type: integer, minimum: 0, maximum: 5 }
                  next_page: { type: ["null"] }
                  previous_page: { type: ["null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: CreateTicket
      summary: Create a ticket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: { $ref: "#/components/schemas/TicketCreateInput" }
      responses:
        "201":
          description: The new ticket and the audit of its creation.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/RecordInvalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v2/tickets/{ticket_id}:
    parameters:
      - { name: ticket_id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: ShowTicket
      summary: Show one ticket.
      responses:
        "200":
          description: The ticket.
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket: { $ref: "#/components/schemas/TicketObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/RecordNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: UpdateTicket
      summary: Update a ticket; a `comment` adds a public reply or internal note.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: { $ref: "#/components/schemas/TicketUpdateInput" }
      responses:
        "200":
          description: The updated ticket and the audit of the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/RecordNotFound" }
        "422": { $ref: "#/components/responses/RecordInvalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v2/tickets/{ticket_id}/comments:
    parameters:
      - { name: ticket_id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: ListTicketComments
      summary: The ticket's comments, oldest first.
      parameters:
        - { name: include_inline_images, in: query, schema: { type: boolean } }
        - { name: include, in: query, schema: { type: string, enum: [users] } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        "200":
          description: The comments.
          content:
            application/json:
              schema:
                type: object
                required: [comments, count, next_page, previous_page]
                properties:
                  comments: { type: array, minItems: 1, maxItems: 4, items: { $ref: "#/components/schemas/TicketCommentObject" } }
                  count: { type: integer, minimum: 1, maximum: 4 }
                  next_page: { type: ["null"] }
                  previous_page: { type: ["null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/RecordNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v2/users:
    get:
      operationId: ListUsers
      summary: List users.
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [end-user, agent, admin] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema:
                type: object
                required: [users, count, next_page, previous_page]
                properties:
                  users: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/UserObject" } }
                  count: { type: integer, minimum: 0, maximum: 5 }
                  next_page: { type: ["null"] }
                  previous_page: { type: ["null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: CreateUser
      summary: Create a user (an end user by default).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
                    email: { type: string, format: email }
                    role: { type: string, enum: [end-user, agent, admin] }
                    phone: { type: string }
                    organization_id: { type: integer }
                    external_id: { type: string }
                    tags: { type: array, items: { type: string } }
                    verified: { type: boolean }
      responses:
        "201":
          description: The new user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/UserObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/RecordInvalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v2/users/me:
    get:
      operationId: ShowCurrentUser
      summary: The user the credentials belong to.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/UserObject" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v2/users/{user_id}:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: ShowUser
      summary: Show one user.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/UserObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/RecordNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v2/search:
    get:
      operationId: ListSearchResults
      summary: "Search tickets, users and organizations (query syntax: `type:ticket status:open`)."
      parameters:
        - { name: query, in: query, required: true, schema: { type: string } }
        - { name: sort_by, in: query, schema: { type: string, enum: [updated_at, created_at, priority, status, ticket_type] } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: Matching records.
          content:
            application/json:
              schema:
                type: object
                required: [results, count, facets, next_page, previous_page]
                properties:
                  results:
                    type: array
                    maxItems: 5
                    items:
                      allOf:
                        - $ref: "#/components/schemas/TicketObject"
                        - type: object
                          required: [result_type]
                          properties:
                            result_type: { type: string, const: ticket }
                  count: { type: integer, minimum: 0, maximum: 5 }
                  facets: { type: ["null"] }
                  next_page: { type: ["null"] }
                  previous_page: { type: ["null"] }
        "400":
          description: The query is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  # The same operations with the .json suffix, which Zendesk also accepts and
  # clients such as zenpy and node-zendesk always send. Operation ids end in Json.
  /api/v2/tickets.json:
    get:
      operationId: ListTicketsJson
      summary: List tickets (offset or cursor pagination).
