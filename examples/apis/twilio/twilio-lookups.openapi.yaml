# A hand-written subset of the Twilio Lookups v2 API (phone number lookup),
# written for Mockingbird's examples and covered by its license.
# Shapes and operation ids follow Twilio's published OpenAPI description, which
# is MIT-licensed:
#   https://github.com/twilio/twilio-oai (spec/json/twilio_lookups_v2.json)
openapi: 3.1.0
info:
  title: Twilio - Lookups (Mockingbird example subset)
  version: 1.0.0
servers:
  - url: https://lookups.twilio.com
security:
  - accountSid_authToken: []
paths:
  /v2/PhoneNumbers/{PhoneNumber}:
    get:
      operationId: FetchPhoneNumber
      summary: Look up a phone number, with optional data packages.
      parameters:
        - name: PhoneNumber
          in: path
          required: true
          description: The phone number to look up, in E.164 or national format.
          schema: { type: string }
        - name: Fields
          in: query
          description: Comma-separated data packages, e.g. line_type_intelligence,caller_name.
          schema: { type: string }
        - name: CountryCode
          in: query
          description: ISO 3166-1 alpha-2 country used when PhoneNumber is in national format.
          schema: { type: string, pattern: "^[A-Z]{2}$" }
      responses:
        "200":
          description: The lookup result. An unparseable number answers 200 with valid=false.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LookupResponse" }
        "404":
          description: The phone number was not found (error 20404).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/twilio_error" }
        "429":
          description: Too many requests (error 20429).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/twilio_error" }
components:
  securitySchemes:
    accountSid_authToken: { type: http, scheme: basic }
  schemas:
    twilio_error:
      type: object
      required: [code, message, more_info, status]
      properties:
        code: { type: integer }
        message: { type: string }
        more_info: { type: string, format: uri }
        status: { type: integer }
    LookupResponse:
      type: object
      required: [calling_country_code, country_code, phone_number, national_format, valid, validation_errors, caller_name, line_type_intelligence, url]
      properties:
        calling_country_code: { type: string, const: "1" }
        country_code: { type: string, const: US }
        phone_number: { type: string, pattern: "^\\+1[2-9][0-9]{9}$" }
        national_format: { type: string, pattern: "^\\([2-9][0-9]{2}\\) [0-9]{3}-[0-9]{4}$" }
        valid: { type: boolean }
        validation_errors:
          type: array
          items: { type: string, enum: [TOO_SHORT, TOO_LONG, INVALID_BUT_POSSIBLE, INVALID_COUNTRY_CODE, INVALID_LENGTH, NOT_A_NUMBER] }
        caller_name:
          type: [object, "null"]
          properties:
            caller_name: { type: [string, "null"] }
            caller_type: { type: [string, "null"], enum: [CONSUMER, BUSINESS, null] }
            error_code: { type: [integer, "null"] }
        line_type_intelligence:
          type: [object, "null"]
          properties:
            mobile_country_code: { type: string, pattern: "^3[0-9]{2}$" }
            mobile_network_code: { type: string, pattern: "^[0-9]{3}$" }
            carrier_name: { type: string }
            type: { type: string, enum: [mobile, landline, fixedVoip, nonFixedVoip, tollFree, voicemail, personal, pager, sharedCost, uan, unknown] }
            error_code: { type: [integer, "null"] }
        url: { type: string, pattern: "^https://lookups\\.twilio\\.com/v2/PhoneNumbers/\\+1[0-9]{10}$" }
