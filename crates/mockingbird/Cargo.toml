[package]
name = "mockingbird"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "mockingbird"
path = "src/main.rs"

[features]
default = ["mqtt", "amqp"]
mqtt = ["mb-protocols/mqtt"]
amqp = ["mb-protocols/amqp"]
kafka = ["mb-protocols/kafka"]
full = ["mqtt", "amqp", "kafka"]

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["http2"] }
axum-server.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
flate2.workspace = true
futures.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
humantime.workspace = true
humantime-serde.workspace = true
mb-admin.workspace = true
mb-auth.workspace = true
mb-console.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
sha2.workspace = true
mb-engine.workspace = true
mb-ext.workspace = true
mb-import = { workspace = true, features = ["smart"] }
mb-llm.workspace = true
mb-mcm.workspace = true
mb-protocols.workspace = true
mb-state.workspace = true
mb-store.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
rcgen.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
json-patch.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["signal", "io-std", "io-util"] }
tokio-rustls.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
uuid.workspace = true
webpki-root-certs.workspace = true

[dev-dependencies]
async-trait.workspace = true
assert_cmd.workspace = true
mb-auth = { workspace = true, features = ["testing"] }
prost-reflect.workspace = true
redis.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
tonic = { workspace = true, features = ["tls-aws-lc"] }
