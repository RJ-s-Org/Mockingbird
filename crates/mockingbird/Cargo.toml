[package]
name = "mockingbird-cli"
description = "LLM-backed API mocks from contracts: stateful, every protocol, a zero-edit HTTPS proxy and an MCP server. Installs the `mockingbird` command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["mock", "openapi", "llm", "testing", "mcp"]
categories = ["command-line-utilities", "development-tools::testing"]
# `embedded/` (the example catalog and agent skills, see build.rs) is not in
# git; the release workflow copies it in before publishing.
include = ["/src/**", "/build.rs", "/embedded/**", "/Cargo.toml"]

# `cargo binstall mockingbird-cli` downloads the release archive instead of
# building. The archives are named after the binary (`mockingbird-…`), not the
# package. (`mockingbird` on crates.io belongs to another project.)
[package.metadata.binstall]
pkg-url = "https://github.com/RJ-s-Org/Mockingbird/releases/download/v{ version }/mockingbird-{ version }-{ target }{ archive-suffix }"
bin-dir = "mockingbird-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# docs.rs documents every broker feature.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

# The library keeps the name `mockingbird` (`use mockingbird::…`).
[lib]
name = "mockingbird"
path = "src/lib.rs"

[[bin]]
name = "mockingbird"
path = "src/main.rs"

[features]
default = ["mqtt", "amqp"]
mqtt = ["mb-protocols/mqtt"]
amqp = ["mb-protocols/amqp"]
kafka = ["mb-protocols/kafka"]
full = ["mqtt", "amqp", "kafka"]

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["http2"] }
axum-server.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
flate2.workspace = true
futures.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
humantime.workspace = true
humantime-serde.workspace = true
mb-admin.workspace = true
mb-auth.workspace = true
mb-console.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
sha2.workspace = true
sha1.workspace = true
mb-engine.workspace = true
mb-ext.workspace = true
mb-import = { workspace = true, features = ["smart"] }
mb-llm.workspace = true
mb-mcm.workspace = true
mb-protocols.workspace = true
mb-state.workspace = true
mb-store.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
rcgen.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
json-patch.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["signal", "io-std", "io-util", "process"] }
tokio-rustls.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
uuid.workspace = true
webpki-root-certs.workspace = true

[dev-dependencies]
async-trait.workspace = true
assert_cmd.workspace = true
mb-auth = { workspace = true, features = ["testing"] }
prost-reflect.workspace = true
redis.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
tonic = { workspace = true, features = ["tls-aws-lc"] }
tonic-health.workspace = true
wiremock.workspace = true
predicates = "3"
x509-parser = "0.18.1"
