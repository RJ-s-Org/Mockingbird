[package]
name = "mockingbird-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal crate of Mockingbird (the Admin API), published for mockingbird-cli; no API stability guarantee. Use mockingbird-cli for the binary and mb-ext for extensions."

# The library keeps its name (`use mb_admin::…`).
[lib]
name = "mb_admin"

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
axum = { workspace = true, features = ["macros", "multipart"] }
base64.workspace = true
chrono.workspace = true
mb-auth.workspace = true
mb-engine.workspace = true
mb-ext.workspace = true
mb-import = { workspace = true, features = ["smart"] }
mb-llm.workspace = true
mb-mcm.workspace = true
mb-protocols.workspace = true
mb-state.workspace = true
mb-store.workspace = true
metrics.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
utoipa.workspace = true
uuid.workspace = true

[dev-dependencies]
http-body-util.workspace = true
mb-auth = { workspace = true, features = ["testing"] }
mb-llm = { workspace = true, features = ["testing"] }
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
sqlx.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower.workspace = true
tracing-subscriber.workspace = true
wiremock.workspace = true
zip.workspace = true
