[package]
name = "mockingbird-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal crate of Mockingbird (the LLM provider client), published for mockingbird-cli; no API stability guarantee. Use mockingbird-cli for the binary and mb-ext for extensions."

# The library keeps its name (`use mb_llm::…`).
[lib]
name = "mb_llm"

[lints]
workspace = true

[features]
testing = []

[dependencies]
async-trait.workspace = true
eventsource-stream.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
wiremock.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "fallback"
required-features = ["testing"]

[[test]]
name = "scripted"
required-features = ["testing"]
