[package]
name = "mb-protocols"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["http-rest", "sse", "graphql", "grpc", "soap", "websocket"]
http-rest = ["dep:matchit", "dep:serde_urlencoded", "dep:tower-http"]
sse = ["http-rest"]
websocket = ["axum/ws"]
graphql = ["websocket"]
grpc = ["axum/http2"]
soap = []

[dependencies]
axum.workspace = true
futures.workspace = true
humantime.workspace = true
matchit = { workspace = true, optional = true }
metrics.workspace = true
mb-engine.workspace = true
mb-ext.workspace = true
mb-llm.workspace = true
mb-mcm.workspace = true
mb-state.workspace = true
serde_json.workspace = true
serde_urlencoded = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tower-http = { workspace = true, optional = true }
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
mb-import.workspace = true
mb-llm = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
