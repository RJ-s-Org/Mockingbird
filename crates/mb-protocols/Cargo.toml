[package]
name = "mockingbird-protocols"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal crate of Mockingbird (protocol adapters), published for mockingbird-cli; no API stability guarantee. Use mockingbird-cli for the binary and mb-ext for extensions."

# The library keeps its name (`use mb_protocols::…`).
[lib]
name = "mb_protocols"

[lints]
workspace = true

[features]
default = ["http-rest", "sse", "graphql", "grpc", "soap", "websocket", "events"]
http-rest = ["dep:matchit", "dep:multer", "dep:serde_urlencoded", "dep:tower-http"]
sse = ["http-rest"]
websocket = ["axum/ws"]
graphql = ["websocket", "dep:async-graphql"]
grpc = [
    "axum/http2",
    "dep:http-body",
    "dep:tonic",
    "dep:tonic-reflection",
    "dep:tonic-health",
    "dep:prost",
    "dep:prost-types",
    "dep:prost-reflect",
    "dep:tokio-stream",
]
soap = ["dep:quick-xml"]
events = ["websocket", "dep:cron", "dep:chrono", "dep:uuid"]
mqtt = ["events", "dep:rumqttc"]
amqp = ["events", "dep:lapin"]
kafka = ["events", "dep:rdkafka"]

[dependencies]
async-graphql = { workspace = true, optional = true }
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono = { workspace = true, optional = true }
cron = { workspace = true, optional = true }
futures.workspace = true
hmac.workspace = true
http.workspace = true
http-body = { workspace = true, optional = true }
humantime.workspace = true
lapin = { workspace = true, optional = true }
matchit = { workspace = true, optional = true }
metrics.workspace = true
multer = { workspace = true, optional = true }
mb-engine.workspace = true
mb-ext.workspace = true
mb-llm.workspace = true
mb-mcm.workspace = true
mb-state.workspace = true
prost = { workspace = true, optional = true }
prost-reflect = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
rand.workspace = true
rdkafka = { workspace = true, optional = true }
reqwest.workspace = true
rumqttc = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tonic-health = { workspace = true, optional = true }
tonic-reflection = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing.workspace = true
uuid = { workspace = true, optional = true }

[dev-dependencies]
mb-import.workspace = true
mb-llm = { workspace = true, features = ["testing"] }
rumqttd.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
tower.workspace = true
tracing-subscriber.workspace = true
wiremock.workspace = true

[[test]]
name = "events_mqtt"
required-features = ["mqtt"]

[[test]]
name = "events_amqp"
required-features = ["amqp"]

[[test]]
name = "events_kafka"
required-features = ["kafka"]
