[package]
name = "mb-protocols"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["http-rest", "sse", "graphql", "grpc", "soap", "websocket"]
http-rest = ["dep:matchit", "dep:serde_urlencoded", "dep:tower-http"]
sse = ["http-rest"]
websocket = ["axum/ws"]
graphql = ["websocket", "dep:async-graphql"]
grpc = [
    "axum/http2",
    "dep:http-body",
    "dep:tonic",
    "dep:tonic-reflection",
    "dep:tonic-health",
    "dep:prost",
    "dep:prost-types",
    "dep:prost-reflect",
    "dep:tokio-stream",
]
soap = []

[dependencies]
async-graphql = { workspace = true, optional = true }
axum.workspace = true
futures.workspace = true
http-body = { workspace = true, optional = true }
humantime.workspace = true
matchit = { workspace = true, optional = true }
metrics.workspace = true
mb-engine.workspace = true
mb-ext.workspace = true
mb-llm.workspace = true
mb-mcm.workspace = true
mb-state.workspace = true
prost = { workspace = true, optional = true }
prost-reflect = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
serde_json.workspace = true
serde_urlencoded = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tonic-health = { workspace = true, optional = true }
tonic-reflection = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
mb-import.workspace = true
mb-llm = { workspace = true, features = ["testing"] }
reqwest.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
tower.workspace = true
