[package]
name = "mockingbird-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal crate of Mockingbird (auth, roles and API keys), published for mockingbird-cli; no API stability guarantee. Use mockingbird-cli for the binary and mb-ext for extensions."

# The library keeps its name (`use mb_auth::…`).
[lib]
name = "mb_auth"

[lints]
workspace = true

[features]
testing = ["dep:wiremock", "dep:rsa"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
http.workspace = true
jsonwebtoken.workspace = true
mb-llm.workspace = true
mb-store.workspace = true
openidconnect.workspace = true
rand.workspace = true
reqwest.workspace = true
rsa = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "rt"] }
tracing.workspace = true
wiremock = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
