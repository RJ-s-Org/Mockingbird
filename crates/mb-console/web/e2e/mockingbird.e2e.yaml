server:
  port: 18080
  admin_port: 19090

storage:
  url: "sqlite::memory:"

auth:
  mode: none

mocks:
  files:
    workspace: default
    contract: ../../../../fixtures/openapi/orders-3.0.yaml
    route_prefix: /files
