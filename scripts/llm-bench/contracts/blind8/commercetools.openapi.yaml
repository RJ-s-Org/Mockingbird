openapi: 3.0.3
info:
  title: commercetools HTTP API (carts and orders)
  version: "1.0"
  description: |
    A subset of the commercetools Composable Commerce HTTP API, written from its public
    documentation. Every path starts with the project key. A cart can be addressed by
    its `id` (`/carts/{ID}`) or by the user-defined `key` it was given
    (`/carts/key={key}`); both paths answer and change the same cart.

    Every resource carries `version`, 1 when created and one more for each update.
    A cart is changed by `POST /carts/{ID}` with `{version, actions}`: `version` must be
    the cart's current one, and `actions` is a list of update actions applied in order
    (`setCustomerEmail`, `setShippingAddress`, `addCustomLineItem`,
    `changeCustomLineItemQuantity`, `removeCustomLineItem`, `setKey`, ...). The update
    either applies every action and answers the cart with `version` one higher, or
    applies none. A `version` that is not the current one is refused with 409 and the
    error code `ConcurrentModification`, whose `currentVersion` is the cart's version;
    the cart is left as it was.

    Money is an object: `{type, currencyCode, centAmount, fractionDigits}`, with the
    amount in the currency's minor unit (`centAmount` 1250 with `fractionDigits` 2 is
    12.50 EUR). Drafts send `{currencyCode, centAmount}`. A cart has one currency, set
    when it is made. A custom line item's `totalPrice` is its `money` times its
    `quantity`; with `taxMode` `Disabled` the cart's `totalPrice` is the sum of its line
    items' and custom line items' `totalPrice`.

    A new cart is `Active`. `POST /orders` with the cart's `id` and current `version`
    makes an order from it: the order answers 201 with `orderState` `Open`, the cart's
    line items and `totalPrice`, and a reference to the cart, and the cart reads with
    `cartState` `Ordered` afterwards. A cart can be ordered once.

    Queries answer `{limit, offset, count, total, results}`: `where` takes a query
    predicate (`customerEmail = "a@example.org"`, `cartState = "Active"`, joined with
    `and`), `limit` (1 to 500, default 20) and `offset` page the results, and `total`
    counts every match unless `withTotal=false`. `DELETE` needs the current `version` in
    the query and answers the deleted resource; afterwards the id answers 404
    `ResourceNotFound`. Errors are `{statusCode, message, errors: [{code, message}]}`.
servers:
  - url: https://api.europe-west1.gcp.commercetools.com
security:
  - oauth2: []
tags:
  - name: Carts
  - name: Orders
paths:
  /{projectKey}/carts:
    parameters:
      - $ref: "#/components/parameters/projectKey"
    get:
      tags: [Carts]
      operationId: queryCarts
      summary: Query carts
      parameters:
        - $ref: "#/components/parameters/where"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/withTotal"
      responses:
        "200":
          description: The carts that match.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedQueryResponse"
                  - type: object
                    properties:
                      results:
                        type: array
                        items: {$ref: "#/components/schemas/Cart"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [Carts]
      operationId: createCart
      summary: Create a cart
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CartDraft"}
      responses:
        "201":
          description: The new cart, at version 1 and Active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cart"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /{projectKey}/carts/{ID}:
    parameters:
      - $ref: "#/components/parameters/projectKey"
      - $ref: "#/components/parameters/cartId"
    get:
      tags: [Carts]
      operationId: getCartById
      summary: Get a cart by id
      responses:
        "200":
          description: The cart.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cart"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Carts]
      operationId: updateCartById
      summary: Update a cart by id
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CartUpdate"}
      responses:
        "200":
          description: The cart after every action, one version higher.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cart"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ConcurrentModification"}
    delete:
      tags: [Carts]
      operationId: deleteCartById
      summary: Delete a cart by id
      parameters:
        - $ref: "#/components/parameters/version"
      responses:
        "200":
          description: The deleted cart.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cart"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ConcurrentModification"}
  /{projectKey}/carts/key={key}:
    parameters:
      - $ref: "#/components/parameters/projectKey"
      - $ref: "#/components/parameters/cartKey"
    get:
      tags: [Carts]
      operationId: getCartByKey
      summary: Get a cart by key
      responses:
        "200":
          description: The cart with the key.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cart"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Carts]
      operationId: updateCartByKey
      summary: Update a cart by key
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CartUpdate"}
      responses:
        "200":
          description: The cart after every action, one version higher.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cart"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ConcurrentModification"}
    delete:
      tags: [Carts]
      operationId: deleteCartByKey
      summary: Delete a cart by key
      parameters:
        - $ref: "#/components/parameters/version"
      responses:
        "200":
          description: The deleted cart.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cart"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ConcurrentModification"}
  /{projectKey}/orders:
    parameters:
      - $ref: "#/components/parameters/projectKey"
    get:
      tags: [Orders]
      operationId: queryOrders
      summary: Query orders
      parameters:
        - $ref: "#/components/parameters/where"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/withTotal"
      responses:
        "200":
          description: The orders that match.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedQueryResponse"
                  - type: object
                    properties:
                      results:
                        type: array
                        items: {$ref: "#/components/schemas/Order"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [Orders]
      operationId: createOrderFromCart
      summary: Create an order from a cart
      description: "`version` must be the cart's current version. The cart is `Ordered` afterwards; an ordered cart cannot be ordered again."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrderFromCartDraft"}
      responses:
        "201":
          description: The new order, Open.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/ConcurrentModification"}
  /{projectKey}/orders/{ID}:
    parameters:
      - $ref: "#/components/parameters/projectKey"
      - name: ID
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Orders]
      operationId: getOrderById
      summary: Get an order by id
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.europe-west1.gcp.commercetools.com/oauth/token
          scopes:
            manage_orders: Create and change carts and orders.
  parameters:
    projectKey:
      name: projectKey
      in: path
      required: true
      schema: {type: string}
    cartId:
      name: ID
      in: path
      required: true
      schema: {type: string, format: uuid}
    cartKey:
      name: key
      in: path
      required: true
      description: The key the cart was given.
      schema: {type: string, pattern: "^[A-Za-z0-9_-]{2,256}$"}
    version:
      name: version
      in: query
      required: true
      description: The resource's current version.
      schema: {type: integer}
    where:
      name: where
      in: query
      description: "A query predicate, such as `customerEmail = \"ana@example.org\"`. May be repeated; repeated predicates are joined with `and`."
      schema: {type: string}
    sort:
      name: sort
      in: query
      description: "A field and direction, such as `createdAt desc`."
      schema: {type: string}
    limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 20}
    offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
    withTotal:
      name: withTotal
      in: query
      description: With false, `total` is left out.
      schema: {type: boolean, default: true}
  responses:
    BadRequest:
      description: A field, an update action or a predicate is not valid (`InvalidInput`, `InvalidOperation`, `InvalidField`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Unauthorized:
      description: No valid access token.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    NotFound:
      description: "No resource has the id or key (`ResourceNotFound`)."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    ConcurrentModification:
      description: "The version sent is not the current one (`ConcurrentModification`); nothing changed."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
  schemas:
    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: "Such as `ConcurrentModification`, `ResourceNotFound`, `InvalidOperation` or `InvalidInput`."
        message: {type: string}
        currentVersion: {type: integer, description: "With `ConcurrentModification`: the resource's current version."}
        field: {type: string}
    ErrorResponse:
      type: object
      required: [statusCode, message, errors]
      properties:
        statusCode: {type: integer}
        message: {type: string}
        errors:
          type: array
          items: {$ref: "#/components/schemas/ErrorObject"}
    PagedQueryResponse:
      type: object
      required: [limit, offset, count, results]
      properties:
        limit: {type: integer}
        offset: {type: integer}
        count: {type: integer, description: The results on this page.}
        total: {type: integer, description: Every match; left out with withTotal=false.}
        results:
          type: array
          items: {type: object}
    LocalizedString:
      type: object
      description: "Text by locale, such as `{\"en\": \"Gift wrap\"}`."
      additionalProperties: {type: string}
    Money:
      type: object
      required: [currencyCode, centAmount]
      properties:
        currencyCode: {type: string, pattern: "^[A-Z]{3}$"}
        centAmount: {type: integer, description: The amount in the currency's minor unit.}
    CentPrecisionMoney:
      type: object
      required: [type, currencyCode, centAmount, fractionDigits]
      properties:
        type: {type: string, enum: [centPrecision]}
        currencyCode: {type: string, pattern: "^[A-Z]{3}$"}
        centAmount: {type: integer}
        fractionDigits: {type: integer, description: 2 for EUR and USD.}
    Address:
      type: object
      required: [country]
      properties:
        id: {type: string}
        key: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        streetName: {type: string}
        streetNumber: {type: string}
        postalCode: {type: string}
        city: {type: string}
        country: {type: string, pattern: "^[A-Z]{2}$", description: ISO 3166-1 alpha-2.}
        email: {type: string}
    Reference:
      type: object
      required: [typeId, id]
      properties:
        typeId: {type: string, enum: [cart, order, customer, product, tax-category]}
        id: {type: string}
    CustomLineItemDraft:
      type: object
      required: [name, quantity, money, slug]
      properties:
        key: {type: string}
        name: {$ref: "#/components/schemas/LocalizedString"}
        quantity: {type: integer, minimum: 1}
        money: {$ref: "#/components/schemas/Money"}
        slug: {type: string}
        priceMode: {type: string, enum: [Standard, External], default: Standard}
    CustomLineItem:
      type: object
      required: [id, name, money, totalPrice, slug, quantity]
      properties:
        id: {type: string}
        key: {type: string}
        name: {$ref: "#/components/schemas/LocalizedString"}
        money: {$ref: "#/components/schemas/CentPrecisionMoney"}
        totalPrice: {$ref: "#/components/schemas/CentPrecisionMoney"}
        slug: {type: string}
        quantity: {type: integer}
        priceMode: {type: string, enum: [Standard, External]}
    LineItem:
      type: object
      required: [id, productId, quantity, totalPrice]
      properties:
        id: {type: string}
        productId: {type: string}
        sku: {type: string}
        name: {$ref: "#/components/schemas/LocalizedString"}
        quantity: {type: integer}
        price:
          type: object
          properties:
            id: {type: string}
            value: {$ref: "#/components/schemas/CentPrecisionMoney"}
        totalPrice: {$ref: "#/components/schemas/CentPrecisionMoney"}
    CartDraft:
      type: object
      required: [currency]
      properties:
        key: {type: string, pattern: "^[A-Za-z0-9_-]{2,256}$"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        customerEmail: {type: string}
        customerId: {type: string}
        anonymousId: {type: string}
        country: {type: string, pattern: "^[A-Z]{2}$"}
        taxMode: {type: string, enum: [Platform, External, ExternalAmount, Disabled], default: Platform}
        inventoryMode: {type: string, enum: [None, TrackOnly, ReserveOnOrder], default: None}
        shippingAddress: {$ref: "#/components/schemas/Address"}
        billingAddress: {$ref: "#/components/schemas/Address"}
        customLineItems:
          type: array
          items: {$ref: "#/components/schemas/CustomLineItemDraft"}
        locale: {type: string}
    Cart:
      type: object
      required: [id, version, cartState, lineItems, customLineItems, totalPrice, taxMode, createdAt, lastModifiedAt]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, description: 1 when created; one more for each update.}
        key: {type: string}
        customerEmail: {type: string}
        customerId: {type: string}
        anonymousId: {type: string}
        country: {type: string}
        cartState: {type: string, enum: [Active, Merged, Ordered, Frozen]}
        taxMode: {type: string, enum: [Platform, External, ExternalAmount, Disabled]}
        inventoryMode: {type: string, enum: [None, TrackOnly, ReserveOnOrder]}
        lineItems:
          type: array
          items: {$ref: "#/components/schemas/LineItem"}
        customLineItems:
          type: array
          items: {$ref: "#/components/schemas/CustomLineItem"}
        totalPrice: {$ref: "#/components/schemas/CentPrecisionMoney"}
        totalLineItemQuantity: {type: integer}
        shippingAddress: {$ref: "#/components/schemas/Address"}
        billingAddress: {$ref: "#/components/schemas/Address"}
        locale: {type: string}
        createdAt: {type: string, format: date-time}
        lastModifiedAt: {type: string, format: date-time}
    CartUpdateAction:
      type: object
      required: [action]
      description: |
        One update action. The fields besides `action` depend on it:
        `setCustomerEmail` {email}; `setShippingAddress` {address};
        `addCustomLineItem` {name, quantity, money, slug, key};
        `changeCustomLineItemQuantity` {customLineItemId or customLineItemKey, quantity};
        `removeCustomLineItem` {customLineItemId or customLineItemKey}; `setKey` {key}.
      properties:
        action:
          type: string
          enum: [setCustomerEmail, setShippingAddress, setBillingAddress, addCustomLineItem,
                 changeCustomLineItemQuantity, removeCustomLineItem, setKey, setCountry, setLocale]
        email: {type: string}
        address: {$ref: "#/components/schemas/Address"}
        name: {$ref: "#/components/schemas/LocalizedString"}
        quantity: {type: integer, minimum: 0}
        money: {$ref: "#/components/schemas/Money"}
        slug: {type: string}
        key: {type: string}
        customLineItemId: {type: string}
        customLineItemKey: {type: string}
        country: {type: string}
        locale: {type: string}
    CartUpdate:
      type: object
      required: [version, actions]
      properties:
        version: {type: integer, description: The cart's current version.}
        actions:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: "#/components/schemas/CartUpdateAction"}
    OrderFromCartDraft:
      type: object
      required: [cart, version]
      properties:
        cart: {$ref: "#/components/schemas/Reference"}
        version: {type: integer, description: The cart's current version.}
        orderNumber: {type: string}
        orderState: {type: string, enum: [Open, Confirmed, Complete, Cancelled], default: Open}
    Order:
      type: object
      required: [id, version, orderState, totalPrice, lineItems, customLineItems, createdAt]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer}
        orderNumber: {type: string}
        customerEmail: {type: string}
        orderState: {type: string, enum: [Open, Confirmed, Complete, Cancelled]}
        cart: {$ref: "#/components/schemas/Reference"}
        lineItems:
          type: array
          items: {$ref: "#/components/schemas/LineItem"}
        customLineItems:
          type: array
          items: {$ref: "#/components/schemas/CustomLineItem"}
        totalPrice: {$ref: "#/components/schemas/CentPrecisionMoney"}
        taxMode: {type: string}
        shippingAddress: {$ref: "#/components/schemas/Address"}
        createdAt: {type: string, format: date-time}
        lastModifiedAt: {type: string, format: date-time}
