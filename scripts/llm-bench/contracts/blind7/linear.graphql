# A subset of the Linear GraphQL API (teams, issues, comments), written from its
# public documentation for the LLM bench's seventh blind journeys. Type, field and
# argument names follow Linear's public schema; descriptions say what a client is
# promised.
#
# Every request is a POST of {query, variables} to /graphql. Ids are UUIDs. Lists
# are Relay connections: `nodes`, `edges { cursor node }` and `pageInfo`, paged
# forward with `first` and `after` (an `endCursor`). A list leaves out archived
# entities unless `includeArchived: true`. An unknown or deleted id answers an
# error in `errors` (message "Entity not found", extensions.code "INVALID_INPUT"),
# and `data` is null for a non-null field.

schema {
  query: Query
  mutation: Mutation
}

"""An ISO 8601 date-time."""
scalar DateTime

"""A date without a time, such as 2026-11-30."""
scalar TimelessDate

"""Cursor pagination of a connection."""
type PageInfo {
  """Whether a page follows this one."""
  hasNextPage: Boolean!
  """Whether a page comes before this one."""
  hasPreviousPage: Boolean!
  """The cursor of the first node."""
  startCursor: String
  """The cursor of the last node; send it as `after` for the next page."""
  endCursor: String
}

"""An account in the workspace."""
type User {
  id: ID!
  name: String!
  displayName: String!
  email: String!
  active: Boolean!
  createdAt: DateTime!
}

"""A team owns issues; its `key` prefixes their identifiers."""
type Team {
  id: ID!
  """Short, uppercase and unique in the workspace, such as ENG."""
  key: String!
  name: String!
  description: String
  private: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  archivedAt: DateTime
  """The team's issues, archived ones left out unless includeArchived is true."""
  issues(first: Int, after: String, filter: IssueFilter, includeArchived: Boolean = false): IssueConnection!
  """The team's workflow states."""
  states(first: Int, after: String): WorkflowStateConnection!
}

type TeamConnection {
  nodes: [Team!]!
  edges: [TeamEdge!]!
  pageInfo: PageInfo!
}

type TeamEdge {
  cursor: String!
  node: Team!
}

"""A step of a team's workflow."""
type WorkflowState {
  id: ID!
  name: String!
  """backlog, unstarted, started, completed or canceled."""
  type: String!
  color: String!
  position: Float!
}

type WorkflowStateConnection {
  nodes: [WorkflowState!]!
  pageInfo: PageInfo!
}

"""A label that can be put on issues."""
type IssueLabel {
  id: ID!
  name: String!
  color: String!
}

type IssueLabelConnection {
  nodes: [IssueLabel!]!
  pageInfo: PageInfo!
}

"""An issue of a team."""
type Issue {
  id: ID!
  """The team's key, a dash and `number`, such as ENG-42."""
  identifier: String!
  """Counted from 1 within the team."""
  number: Float!
  title: String!
  """Markdown."""
  description: String
  """0 none, 1 urgent, 2 high, 3 medium, 4 low."""
  priority: Float!
  """The name of `priority`: No priority, Urgent, High, Medium or Low."""
  priorityLabel: String!
  estimate: Float
  dueDate: TimelessDate
  url: String!
  team: Team!
  state: WorkflowState!
  assignee: User
  creator: User
  labels(first: Int, after: String): IssueLabelConnection!
  """The issue's comments, oldest first."""
  comments(first: Int, after: String, includeArchived: Boolean = false): CommentConnection!
  createdAt: DateTime!
  updatedAt: DateTime!
  """When the issue was archived; null while it is not."""
  archivedAt: DateTime
  """Whether the issue is in the trash."""
  trashed: Boolean
  completedAt: DateTime
  canceledAt: DateTime
}

type IssueConnection {
  nodes: [Issue!]!
  edges: [IssueEdge!]!
  pageInfo: PageInfo!
}

type IssueEdge {
  cursor: String!
  node: Issue!
}

"""A comment on an issue."""
type Comment {
  id: ID!
  """Markdown."""
  body: String!
  """The issue the comment is on."""
  issue: Issue!
  user: User
  url: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  editedAt: DateTime
  archivedAt: DateTime
}

type CommentConnection {
  nodes: [Comment!]!
  edges: [CommentEdge!]!
  pageInfo: PageInfo!
}

type CommentEdge {
  cursor: String!
  node: Comment!
}

"""Compares an id."""
input IDComparator {
  eq: ID
  neq: ID
  in: [ID!]
  nin: [ID!]
}

"""Compares a string."""
input StringComparator {
  eq: String
  neq: String
  in: [String!]
  nin: [String!]
  contains: String
  containsIgnoreCase: String
  startsWith: String
}

"""Compares a number that may be null."""
input NullableNumberComparator {
  eq: Float
  neq: Float
  in: [Float!]
  nin: [Float!]
  lt: Float
  lte: Float
  gt: Float
  gte: Float
  null: Boolean
}

"""Matches teams."""
input TeamFilter {
  id: IDComparator
  key: StringComparator
  name: StringComparator
}

"""Matches issues; every field given must match."""
input IssueFilter {
  id: IDComparator
  title: StringComparator
  priority: NullableNumberComparator
  number: NullableNumberComparator
  team: TeamFilter
  and: [IssueFilter!]
  or: [IssueFilter!]
}

input TeamCreateInput {
  name: String!
  """Unique in the workspace; one in use is refused with an error."""
  key: String
  description: String
  private: Boolean
}

input IssueCreateInput {
  teamId: String!
  title: String!
  description: String
  """0 none, 1 urgent, 2 high, 3 medium, 4 low; 0 when not given."""
  priority: Int
  estimate: Int
  dueDate: TimelessDate
  assigneeId: String
  stateId: String
  labelIds: [String!]
}

"""Changes only the fields given."""
input IssueUpdateInput {
  title: String
  description: String
  priority: Int
  estimate: Int
  dueDate: TimelessDate
  assigneeId: String
  stateId: String
  labelIds: [String!]
}

input CommentCreateInput {
  issueId: String!
  body: String!
}

input CommentUpdateInput {
  body: String!
}

type TeamPayload {
  success: Boolean!
  lastSyncId: Float!
  team: Team
}

type IssuePayload {
  success: Boolean!
  lastSyncId: Float!
  issue: Issue
}

type IssueArchivePayload {
  success: Boolean!
  lastSyncId: Float!
  """The issue as it is after the change."""
  entity: Issue
}

type CommentPayload {
  success: Boolean!
  lastSyncId: Float!
  comment: Comment
}

type DeletePayload {
  success: Boolean!
  lastSyncId: Float!
  """The id of what was deleted."""
  entityId: String!
}

"""
Linear's API: teams own issues, issues hold comments.

Ids are UUIDs. An issue's `identifier` is its team's `key`, a dash and the issue's
`number`, counted from 1 within the team. Lists are connections paged with `first`
and `after` and leave out archived entities unless `includeArchived` is true. An
unknown or deleted id answers an error and no data.
"""
type Query {
  """The user the key belongs to."""
  viewer: User!
  """A team by id."""
  team(id: String!): Team!
  """The workspace's teams."""
  teams(first: Int, after: String, filter: TeamFilter, includeArchived: Boolean = false): TeamConnection!
  """An issue by id or identifier; an archived issue still answers, with archivedAt set."""
  issue(id: String!): Issue!
  """Issues that match the filter, newest first; archived ones only with includeArchived true."""
  issues(first: Int, after: String, filter: IssueFilter, includeArchived: Boolean = false): IssueConnection!
  """A comment by id; a deleted comment answers an error."""
  comment(id: String!): Comment!
  """Comments, newest first."""
  comments(first: Int, after: String, includeArchived: Boolean = false): CommentConnection!
}

"""
Changes to Linear's teams, issues and comments. Each answers a payload with
`success` and the entity as it is after the change; a later read returns it the
same way. An archived issue keeps answering by id, with `archivedAt` set, and is
left out of lists unless they ask for archived issues.
"""
type Mutation {
  """Creates a team."""
  teamCreate(input: TeamCreateInput!): TeamPayload!
  """Creates an issue in a team; it takes the team's next number."""
  issueCreate(input: IssueCreateInput!): IssuePayload!
  """Changes the fields given and keeps the others."""
  issueUpdate(id: String!, input: IssueUpdateInput!): IssuePayload!
  """Archives an issue: it sets archivedAt and leaves lists unless they ask for archived issues."""
  issueArchive(id: String!, trash: Boolean): IssueArchivePayload!
  """Restores an archived issue: archivedAt becomes null and the issue is listed again."""
  issueUnarchive(id: String!): IssueArchivePayload!
  """Comments on an issue."""
  commentCreate(input: CommentCreateInput!): CommentPayload!
  """Changes a comment's body."""
  commentUpdate(id: String!, input: CommentUpdateInput!): CommentPayload!
  """Deletes a comment; it is no longer found or listed afterwards."""
  commentDelete(id: String!): DeletePayload!
}
