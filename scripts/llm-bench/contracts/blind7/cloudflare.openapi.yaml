openapi: 3.0.3
info:
  title: Cloudflare API v4 (zones and DNS records)
  version: "4.0.0"
  description: |
    A subset of the Cloudflare API v4, written from its public documentation. Every
    answer is an envelope: `success`, `errors` and `messages` (arrays of
    `{code, message}`), and `result`, the resource or the array of resources. Lists
    also answer `result_info` with `page`, `per_page`, `count` (on this page),
    `total_count` (in all pages) and `total_pages`; they page by number with `page`
    (from 1) and `per_page` (5 to 5000 for DNS records, default 100). Ids are 32
    lowercase hex characters.

    A zone is a domain; a new zone holds no DNS records until they are created.
    A record's `name` may be sent short (`www`) or in full; it is stored and answered
    in full (`www.example.com`). Creating a record identical to an existing one (same
    type, name and content) is refused with 400 and error code 81058. `PATCH` changes
    only the fields it is sent; `PUT` replaces the record, so a field it is not sent
    takes its default (no comment, no tags, `ttl` 1, `proxied` false). Records are filtered by
    `type`, by `name` (the full name, exact match) and by `content`.

    `POST .../dns_records/batch` applies several changes in one call, in the order
    deletes, patches, puts, posts. Its `result` holds, under the same four names,
    the records each change affected, in the order they were sent; nothing is applied
    when one change fails. A deleted record, like an unknown id, answers 404 with
    error code 81044.
servers:
  - url: https://api.cloudflare.com
security:
  - bearer: []
tags:
  - name: Zones
  - name: DNS records
paths:
  /client/v4/zones:
    get:
      tags: [Zones]
      operationId: zones-get
      summary: List zones
      parameters:
        - {name: name, in: query, schema: {type: string}, description: "The domain name of the zone."}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/ZoneStatus"}}
        - $ref: "#/components/parameters/page"
        - {name: per_page, in: query, schema: {type: integer, minimum: 5, maximum: 50, default: 20}}
      responses:
        "200":
          description: A page of zones.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      result:
                        type: array
                        items: {$ref: "#/components/schemas/Zone"}
        "400": {$ref: "#/components/responses/Failure"}
        "401": {$ref: "#/components/responses/Failure"}
    post:
      tags: [Zones]
      operationId: zones-post
      summary: Create a zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, account]
              properties:
                name: {type: string, description: "The domain name, such as example.com."}
                account:
                  type: object
                  required: [id]
                  properties:
                    id: {type: string, pattern: "^[0-9a-f]{32}$"}
                type: {type: string, enum: [full, partial, secondary], default: full}
                jump_start: {type: boolean, description: Whether to scan for existing DNS records.}
      responses:
        "200":
          description: The created zone.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      result: {$ref: "#/components/schemas/Zone"}
        "400": {$ref: "#/components/responses/Failure"}
        "401": {$ref: "#/components/responses/Failure"}
  /client/v4/zones/{zone_id}:
    parameters:
      - $ref: "#/components/parameters/zone_id"
    get:
      tags: [Zones]
      operationId: zones-0-get
      summary: Zone details
      responses:
        "200":
          description: The zone.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      result: {$ref: "#/components/schemas/Zone"}
        "401": {$ref: "#/components/responses/Failure"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Zones]
      operationId: zones-0-delete
      summary: Delete a zone
      responses:
        "200":
          description: The deleted zone's id.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      result: {$ref: "#/components/schemas/IdOnly"}
        "401": {$ref: "#/components/responses/Failure"}
        "404": {$ref: "#/components/responses/NotFound"}
  /client/v4/zones/{zone_id}/dns_records:
    parameters:
      - $ref: "#/components/parameters/zone_id"
    get:
      tags: [DNS records]
      operationId: dns-records-for-a-zone-list-dns-records
      summary: List DNS records
      parameters:
        - {name: type, in: query, schema: {$ref: "#/components/schemas/RecordType"}, description: "Only records of this type."}
        - {name: name, in: query, schema: {type: string}, description: "Only records with exactly this full name."}
        - {name: content, in: query, schema: {type: string}, description: "Only records with exactly this content."}
        - name: match
          in: query
          description: Whether a record must match all filters or any of them.
          schema: {type: string, enum: [any, all], default: all}
        - name: order
          in: query
          schema: {type: string, enum: [type, name, content, ttl, proxied]}
        - name: direction
          in: query
          schema: {type: string, enum: [asc, desc]}
        - $ref: "#/components/parameters/page"
        - {name: per_page, in: query, schema: {type: integer, minimum: 5, maximum: 5000, default: 100}}
      responses:
        "200":
          description: A page of the zone's DNS records that match.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      result:
                        type: array
                        items: {$ref: "#/components/schemas/DnsRecord"}
        "400": {$ref: "#/components/responses/Failure"}
        "401": {$ref: "#/components/responses/Failure"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [DNS records]
      operationId: dns-records-for-a-zone-create-dns-record
      summary: Create a DNS record
      description: A record identical to an existing one is refused with 400 and code 81058.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecordInput"}
      responses:
        "200":
          description: The created record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecordEnvelope"}
        "400": {$ref: "#/components/responses/Failure"}
        "401": {$ref: "#/components/responses/Failure"}
        "404": {$ref: "#/components/responses/NotFound"}
  /client/v4/zones/{zone_id}/dns_records/batch:
    parameters:
      - $ref: "#/components/parameters/zone_id"
    post:
      tags: [DNS records]
      operationId: dns-records-for-a-zone-batch-dns-records
      summary: Batch DNS records
      description: |
        Applies the deletes, then the patches, then the puts, then the posts. All of
        them are applied or none is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deletes:
                  type: array
                  items: {$ref: "#/components/schemas/IdOnly"}
                patches:
                  type: array
                  items:
                    allOf:
                      - $ref: "#/components/schemas/IdOnly"
                      - $ref: "#/components/schemas/RecordPatch"
                puts:
                  type: array
                  items:
                    allOf:
                      - $ref: "#/components/schemas/IdOnly"
                      - $ref: "#/components/schemas/RecordInput"
                posts:
                  type: array
                  items: {$ref: "#/components/schemas/RecordInput"}
      responses:
        "200":
          description: The records each change affected, in the order sent.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      result:
                        type: object
                        properties:
                          deletes:
                            type: array
                            description: The deleted records, as they were.
                            items: {$ref: "#/components/schemas/DnsRecord"}
                          patches:
                            type: array
                            items: {$ref: "#/components/schemas/DnsRecord"}
                          puts:
                            type: array
                            items: {$ref: "#/components/schemas/DnsRecord"}
                          posts:
                            type: array
                            items: {$ref: "#/components/schemas/DnsRecord"}
        "400": {$ref: "#/components/responses/Failure"}
        "401": {$ref: "#/components/responses/Failure"}
        "404": {$ref: "#/components/responses/NotFound"}
  /client/v4/zones/{zone_id}/dns_records/{dns_record_id}:
    parameters:
      - $ref: "#/components/parameters/zone_id"
      - {name: dns_record_id, in: path, required: true, schema: {type: string, pattern: "^[0-9a-f]{32}$"}}
    get:
      tags: [DNS records]
      operationId: dns-records-for-a-zone-dns-record-details
      summary: DNS record details
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecordEnvelope"}
        "401": {$ref: "#/components/responses/Failure"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [DNS records]
      operationId: dns-records-for-a-zone-patch-dns-record
      summary: Update a DNS record
      description: Changes only the fields sent.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecordPatch"}
      responses:
        "200":
          description: The updated record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecordEnvelope"}
        "400": {$ref: "#/components/responses/Failure"}
        "401": {$ref: "#/components/responses/Failure"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [DNS records]
      operationId: dns-records-for-a-zone-update-dns-record
      summary: Overwrite a DNS record
      description: Replaces the record; a field not sent takes its default (no comment, no tags, ttl 1).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecordInput"}
      responses:
        "200":
          description: The replaced record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecordEnvelope"}
        "400": {$ref: "#/components/responses/Failure"}
        "401": {$ref: "#/components/responses/Failure"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [DNS records]
      operationId: dns-records-for-a-zone-delete-dns-record
      summary: Delete a DNS record
      responses:
        "200":
          description: The deleted record's id.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      result: {$ref: "#/components/schemas/IdOnly"}
        "401": {$ref: "#/components/responses/Failure"}
        "404": {$ref: "#/components/responses/NotFound"}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API token.
  parameters:
    zone_id:
      name: zone_id
      in: path
      required: true
      schema: {type: string, pattern: "^[0-9a-f]{32}$"}
    page:
      name: page
      in: query
      description: The page to read, from 1.
      schema: {type: integer, minimum: 1, default: 1}
  responses:
    Failure:
      description: |
        The request failed: `success` is false and `errors` says why, such as code
        81058 for a record identical to an existing one, 1061 for a zone that already
        exists, 9109 or 10000 for a token that is not valid.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FailureEnvelope"}
    NotFound:
      description: No zone or record has the id (code 81044 for a DNS record, 1001 for a zone).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FailureEnvelope"}
  schemas:
    Message:
      type: object
      required: [code, message]
      properties:
        code: {type: integer, minimum: 1000}
        message: {type: string}
        documentation_url: {type: string}
        source:
          type: object
          properties:
            pointer: {type: string}
    Envelope:
      type: object
      required: [success, errors, messages, result]
      properties:
        success: {type: boolean, enum: [true]}
        errors:
          type: array
          maxItems: 0
          items: {$ref: "#/components/schemas/Message"}
        messages:
          type: array
          items: {$ref: "#/components/schemas/Message"}
        result: {}
    ListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result_info]
          properties:
            result_info: {$ref: "#/components/schemas/ResultInfo"}
    FailureEnvelope:
      type: object
      required: [success, errors, messages, result]
      properties:
        success: {type: boolean, enum: [false]}
        errors:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Message"}
        messages:
          type: array
          items: {$ref: "#/components/schemas/Message"}
        result: {type: object, nullable: true, enum: [null]}
    ResultInfo:
      type: object
      required: [page, per_page, count, total_count, total_pages]
      properties:
        page: {type: integer, description: This page's number.}
        per_page: {type: integer}
        count: {type: integer, description: The results on this page.}
        total_count: {type: integer, description: The results in all pages.}
        total_pages: {type: integer}
    IdOnly:
      type: object
      required: [id]
      properties:
        id: {type: string, pattern: "^[0-9a-f]{32}$"}
    ZoneStatus:
      type: string
      enum: [initializing, pending, active, moved]
    Zone:
      type: object
      required: [id, name, status, paused, type, name_servers, account, created_on, modified_on]
      properties:
        id: {type: string, pattern: "^[0-9a-f]{32}$"}
        name: {type: string}
        status: {$ref: "#/components/schemas/ZoneStatus"}
        paused: {type: boolean}
        type: {type: string, enum: [full, partial, secondary]}
        development_mode: {type: integer}
        name_servers:
          type: array
          items: {type: string}
        original_name_servers:
          type: array
          nullable: true
          items: {type: string}
        account:
          type: object
          properties:
            id: {type: string}
            name: {type: string}
        owner:
          type: object
          properties:
            id: {type: string, nullable: true}
            type: {type: string}
            email: {type: string, nullable: true}
        plan:
          type: object
          properties:
            id: {type: string}
            name: {type: string}
        created_on: {type: string, format: date-time}
        modified_on: {type: string, format: date-time}
        activated_on: {type: string, format: date-time, nullable: true}
    RecordType:
      type: string
      enum: [A, AAAA, CAA, CERT, CNAME, DNSKEY, DS, HTTPS, LOC, MX, NAPTR, NS, PTR, SMIMEA, SRV, SSHFP, SVCB,
             TLSA, TXT, URI]
    RecordPatch:
      type: object
      properties:
        type: {$ref: "#/components/schemas/RecordType"}
        name: {type: string, maxLength: 255, description: "Short (`www`) or full; stored in full."}
        content: {type: string, description: "The value: an IPv4 address for A, a host name for CNAME, text for TXT."}
        ttl: {type: integer, description: "Seconds, 60 to 86400, or 1 for automatic."}
        proxied: {type: boolean}
        priority: {type: integer, minimum: 0, maximum: 65535}
        comment: {type: string, maxLength: 100}
        tags:
          type: array
          items: {type: string, description: "name:value"}
    RecordInput:
      allOf:
        - $ref: "#/components/schemas/RecordPatch"
        - type: object
          required: [type, name, content]
    DnsRecord:
      type: object
      required: [id, type, name, content, proxiable, proxied, ttl, settings, meta, comment, tags, created_on,
                 modified_on]
      properties:
        id: {type: string, pattern: "^[0-9a-f]{32}$"}
        zone_id: {type: string, pattern: "^[0-9a-f]{32}$"}
        zone_name: {type: string}
        type: {$ref: "#/components/schemas/RecordType"}
        name: {type: string, description: "The full name, such as www.example.com."}
        content: {type: string}
        proxiable: {type: boolean}
        proxied: {type: boolean}
        ttl: {type: integer}
        priority: {type: integer}
        settings: {type: object, additionalProperties: true}
        meta: {type: object, additionalProperties: true}
        comment: {type: string, nullable: true}
        tags:
          type: array
          items: {type: string}
        created_on: {type: string, format: date-time}
        modified_on: {type: string, format: date-time}
        comment_modified_on: {type: string, format: date-time}
    RecordEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            result: {$ref: "#/components/schemas/DnsRecord"}
