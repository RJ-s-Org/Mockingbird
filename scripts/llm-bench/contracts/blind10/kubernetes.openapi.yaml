openapi: 3.0.3
info:
  title: Kubernetes API (core v1 namespaces and config maps)
  version: v1
  description: |
    A subset of the Kubernetes API server's core `v1` group, written from the public
    Kubernetes API reference and the "Kubernetes API Concepts" guide. Every object has
    `apiVersion` (`v1`), `kind` (`Namespace`, `ConfigMap`), `metadata` and its own
    fields. Objects are named by natural keys in the path: a namespace by its name, and a
    config map by its namespace and its name (`/api/v1/namespaces/{namespace}/configmaps/{name}`).
    A name is a DNS subdomain: lowercase letters, digits, `-` and `.`, starting and ending
    with a letter or digit, at most 253 characters.

    `metadata` holds `name`, `namespace` (for namespaced objects), `uid` (a UUID the
    server assigns), `resourceVersion` (an opaque string the server changes on every
    write to the object), `creationTimestamp` (RFC 3339, UTC), and the client's `labels`
    and `annotations`. A create may send `metadata.generateName` instead of `name`: the
    server then names the object that prefix followed by five random lowercase letters
    and digits.

    A config map's `data` maps keys to string values. A config map created with
    `immutable: true` can never have its `data` (or `binaryData`) changed: an update or
    patch that would change them is refused with 422 `Invalid`. It can still be deleted.

    Names are unique within a namespace: a create whose name is taken there is refused
    with 409 `AlreadyExists`. The same name may be used in another namespace, and each
    namespace's objects are its own: a list in one namespace never holds another's.

    Updates are optimistic. `PUT` replaces the whole object; when it sends a
    `metadata.resourceVersion` that is no longer current (the object has been written
    since it was read), the update is refused with 409 `Conflict` and nothing changes. A `PUT` that changes the
    object answers it with a new `resourceVersion`. `PATCH` changes part of an object
    without a resourceVersion; with `Content-Type: application/merge-patch+json` the body
    is a JSON merge patch (RFC 7386): keys sent are set, a key sent as `null` is removed,
    and keys not sent are kept.

    Lists (`ConfigMapList`, `NamespaceList`) answer `{apiVersion, kind, metadata, items}`.
    `labelSelector` keeps the objects whose labels match: equality terms (`app=web`,
    `tier!=cache`), set terms (`tier in (cache,db)`, `tier notin (web)`), and existence
    terms (`app`, `!app`), joined by commas, which all must hold. `fieldSelector`
    filters on `metadata.name` and `metadata.namespace` the same way (`metadata.name=x`).
    Lists are paged by `limit`: when more objects follow, `metadata.continue` holds a
    token and `metadata.remainingItemCount` counts the objects after this page (it is
    unset when a label or field selector is used); the next request sends that token
    as `continue` with the same selectors. The last page has no
    `continue` token. Pages of one list never repeat an object.

    `DELETE` answers 200. Deleting a config map answers a `Status` with `status`
    `Success` and `details` naming it (`name`, `kind` `configmaps`, `uid`); it is gone at
    once, and reading it answers 404. Deleting a namespace answers the namespace with
    `status.phase` `Terminating` while its objects are removed.

    Errors are a `Status` object: `{kind: "Status", apiVersion: "v1", status: "Failure",
    message, reason, details, code}` where `code` is the HTTP status and `reason` is
    `NotFound` (404), `AlreadyExists` (409), `Conflict` (409), `Invalid` (422) or
    `BadRequest` (400). `details` names the object (`name`, `kind`) and, for `Invalid`,
    lists `causes` (`reason`, `message`, `field`).
servers:
  - url: https://kubernetes.default.svc
security:
  - bearer: []
tags:
  - name: Namespaces
  - name: ConfigMaps
paths:
  /api/v1/namespaces:
    get:
      tags: [Namespaces]
      operationId: listCoreV1Namespace
      summary: List namespaces
      parameters:
        - $ref: "#/components/parameters/labelSelector"
        - $ref: "#/components/parameters/fieldSelector"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/continue"
      responses:
        "200":
          description: A NamespaceList.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NamespaceList"}
        "400": {$ref: "#/components/responses/Status"}
    post:
      tags: [Namespaces]
      operationId: createCoreV1Namespace
      summary: Create a namespace
      description: "A new namespace is `Active`. A name already used by a namespace is refused with 409 AlreadyExists."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Namespace"}
      responses:
        "201":
          description: The created namespace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Namespace"}
        "409": {$ref: "#/components/responses/Status"}
        "422": {$ref: "#/components/responses/Status"}
  /api/v1/namespaces/{namespace}:
    parameters:
      - $ref: "#/components/parameters/namespace"
    get:
      tags: [Namespaces]
      operationId: readCoreV1Namespace
      summary: Read a namespace
      responses:
        "200":
          description: The namespace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Namespace"}
        "404": {$ref: "#/components/responses/Status"}
    delete:
      tags: [Namespaces]
      operationId: deleteCoreV1Namespace
      summary: Delete a namespace
      description: "Answers the namespace with `status.phase` `Terminating`; its objects are removed with it."
      responses:
        "200":
          description: The namespace, terminating.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Namespace"}
        "404": {$ref: "#/components/responses/Status"}
  /api/v1/configmaps:
    get:
      tags: [ConfigMaps]
      operationId: listCoreV1ConfigMapForAllNamespaces
      summary: List config maps in every namespace
      parameters:
        - $ref: "#/components/parameters/labelSelector"
        - $ref: "#/components/parameters/fieldSelector"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/continue"
      responses:
        "200":
          description: A ConfigMapList over every namespace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConfigMapList"}
        "400": {$ref: "#/components/responses/Status"}
  /api/v1/namespaces/{namespace}/configmaps:
    parameters:
      - $ref: "#/components/parameters/namespace"
    get:
      tags: [ConfigMaps]
      operationId: listCoreV1NamespacedConfigMap
      summary: List config maps in a namespace
      description: "Only this namespace's config maps that match the selectors, paged by `limit` and `continue`."
      parameters:
        - $ref: "#/components/parameters/labelSelector"
        - $ref: "#/components/parameters/fieldSelector"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/continue"
      responses:
        "200":
          description: A ConfigMapList.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConfigMapList"}
        "400": {$ref: "#/components/responses/Status"}
    post:
      tags: [ConfigMaps]
      operationId: createCoreV1NamespacedConfigMap
      summary: Create a config map
      description: "Sets `metadata.namespace` to the path's namespace. A name taken in this namespace is refused with 409 AlreadyExists; `generateName` gets a fresh name."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfigMap"}
      responses:
        "201":
          description: The created config map.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConfigMap"}
        "409": {$ref: "#/components/responses/Status"}
        "422": {$ref: "#/components/responses/Status"}
  /api/v1/namespaces/{namespace}/configmaps/{name}:
    parameters:
      - $ref: "#/components/parameters/namespace"
      - $ref: "#/components/parameters/name"
    get:
      tags: [ConfigMaps]
      operationId: readCoreV1NamespacedConfigMap
      summary: Read a config map
      responses:
        "200":
          description: The config map.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConfigMap"}
        "404": {$ref: "#/components/responses/Status"}
    put:
      tags: [ConfigMaps]
      operationId: replaceCoreV1NamespacedConfigMap
      summary: Replace a config map
      description: |
        Replaces the whole object. When it sends a `metadata.resourceVersion` that is no
        longer current, it is refused with 409 Conflict and nothing changes. Changing the data of
        an immutable config map is refused with 422 Invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfigMap"}
      responses:
        "200":
          description: The replaced config map, with a new resourceVersion.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConfigMap"}
        "404": {$ref: "#/components/responses/Status"}
        "409": {$ref: "#/components/responses/Status"}
        "422": {$ref: "#/components/responses/Status"}
    patch:
      tags: [ConfigMaps]
      operationId: patchCoreV1NamespacedConfigMap
      summary: Patch a config map
      description: |
        With `application/merge-patch+json`, a JSON merge patch: keys sent are set, keys
        sent as null are removed and keys not sent are kept. Changing the data of an
        immutable config map is refused with 422 Invalid.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {type: object, additionalProperties: true}
          application/strategic-merge-patch+json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200":
          description: The patched config map, with a new resourceVersion.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConfigMap"}
        "404": {$ref: "#/components/responses/Status"}
        "422": {$ref: "#/components/responses/Status"}
    delete:
      tags: [ConfigMaps]
      operationId: deleteCoreV1NamespacedConfigMap
      summary: Delete a config map
      responses:
        "200":
          description: "A Status `Success` whose details name the deleted config map."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "404": {$ref: "#/components/responses/Status"}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    namespace:
      name: namespace
      in: path
      required: true
      description: The namespace's name.
      schema: {type: string}
    name:
      name: name
      in: path
      required: true
      description: The config map's name, unique within its namespace.
      schema: {type: string}
    labelSelector:
      name: labelSelector
      in: query
      description: "Terms over labels joined by commas: `app=web`, `tier!=cache`, `tier in (cache,db)`, `tier notin (web)`, `app`, `!app`. All terms must hold."
      schema: {type: string}
    fieldSelector:
      name: fieldSelector
      in: query
      description: "Terms over `metadata.name` and `metadata.namespace`, such as `metadata.name=settings`."
      schema: {type: string}
    limit:
      name: limit
      in: query
      description: "At most this many objects; when more follow, `metadata.continue` holds a token for the next page."
      schema: {type: integer, minimum: 1}
    continue:
      name: continue
      in: query
      description: The `metadata.continue` token of the previous page, sent with the same selectors.
      schema: {type: string}
  responses:
    Status:
      description: "A Status `Failure`: `reason` NotFound (404), AlreadyExists (409), Conflict (409), Invalid (422) or BadRequest (400)."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Status"}
  schemas:
    ObjectMeta:
      type: object
      properties:
        name: {type: string, description: "A DNS subdomain, unique among the objects of its kind in its namespace."}
        generateName: {type: string, description: "On create without a name: the server names the object this prefix and five random lowercase letters and digits."}
        namespace: {type: string, readOnly: true}
        uid: {type: string, format: uuid, readOnly: true}
        resourceVersion: {type: string, description: "Opaque; changed by the server on every write. Sent back on PUT."}
        creationTimestamp: {type: string, format: date-time, readOnly: true}
        deletionTimestamp: {type: string, format: date-time, readOnly: true}
        labels:
          type: object
          additionalProperties: {type: string}
        annotations:
          type: object
          additionalProperties: {type: string}
    ListMeta:
      type: object
      properties:
        resourceVersion: {type: string}
        continue: {type: string, description: "A token for the next page; absent on the last page."}
        remainingItemCount: {type: integer, description: "The number of objects after this page; unset when a label or field selector is used."}
    Namespace:
      type: object
      properties:
        apiVersion: {type: string, enum: [v1]}
        kind: {type: string, enum: [Namespace]}
        metadata: {$ref: "#/components/schemas/ObjectMeta"}
        spec:
          type: object
          properties:
            finalizers:
              type: array
              items: {type: string}
        status:
          type: object
          properties:
            phase: {type: string, enum: [Active, Terminating]}
    NamespaceList:
      type: object
      required: [apiVersion, kind, metadata, items]
      properties:
        apiVersion: {type: string, enum: [v1]}
        kind: {type: string, enum: [NamespaceList]}
        metadata: {$ref: "#/components/schemas/ListMeta"}
        items:
          type: array
          items: {$ref: "#/components/schemas/Namespace"}
    ConfigMap:
      type: object
      properties:
        apiVersion: {type: string, enum: [v1]}
        kind: {type: string, enum: [ConfigMap]}
        metadata: {$ref: "#/components/schemas/ObjectMeta"}
        data:
          type: object
          additionalProperties: {type: string}
        binaryData:
          type: object
          description: Keys to base64-encoded bytes.
          additionalProperties: {type: string, format: byte}
        immutable: {type: boolean, description: "When true, data and binaryData can never change."}
    ConfigMapList:
      type: object
      required: [apiVersion, kind, metadata, items]
      properties:
        apiVersion: {type: string, enum: [v1]}
        kind: {type: string, enum: [ConfigMapList]}
        metadata: {$ref: "#/components/schemas/ListMeta"}
        items:
          type: array
          items: {$ref: "#/components/schemas/ConfigMap"}
    Status:
      type: object
      required: [kind, apiVersion, status]
      properties:
        kind: {type: string, enum: [Status]}
        apiVersion: {type: string, enum: [v1]}
        metadata: {type: object}
        status: {type: string, enum: [Success, Failure]}
        message: {type: string}
        reason: {type: string, enum: [NotFound, AlreadyExists, Conflict, Invalid, BadRequest]}
        code: {type: integer, description: The HTTP status.}
        details:
          type: object
          properties:
            name: {type: string}
            kind: {type: string, example: configmaps}
            uid: {type: string}
            causes:
              type: array
              items:
                type: object
                properties:
                  reason: {type: string, example: FieldValueForbidden}
                  message: {type: string}
                  field: {type: string, example: data}
