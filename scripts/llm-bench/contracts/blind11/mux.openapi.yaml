openapi: 3.0.3
info:
  title: Mux Video API (live streams and their playback ids)
  version: v1
  description: |
    A subset of the Mux Video API, written from its public reference
    (mux.com/docs/api-reference/video). Requests authenticate with HTTP Basic, the
    access token id as the user name and its secret as the password. Bodies are JSON,
    and every answer wraps its content in `data`: one object, or an array for a list.

    A live stream is what an encoder publishes to over RTMP. Creating one
    (`POST /video/v1/live-streams`, 201) gives it an opaque `id`, a secret `stream_key`
    for the encoder, and `status` `idle`. `playback_policies` (`public`, `signed` or
    `drm`) asks for one playback id per policy; a stream without any cannot be played.
    `latency_mode` is `low`, `reduced` or `standard`; `reconnect_window` (seconds,
    0 to 1800, default 60) is how long Mux waits for an encoder to come back;
    `passthrough` is the caller's own string (at most 255 characters), answered back
    as sent. `created_at` is a unix time in seconds, as a string.

    A stream's `status` is `idle` (no broadcast), `active` (a broadcast is in
    progress) or `disabled`. `PUT /live-streams/{id}/disable` disables it: it refuses
    new RTMP connections and ends a broadcast in progress, and answers 200 with
    `{data: {}}`. `PUT /live-streams/{id}/enable` makes a disabled stream `idle` again
    (200, `{data: {}}`). `POST /live-streams/{id}/reset-stream-key` replaces the
    stream key with a new one (the old key stops working) and answers 201 with the
    stream. `PATCH /live-streams/{id}` sets `latency_mode`, `reconnect_window`,
    `passthrough`, `max_continuous_duration` or `meta.title`, keeps the rest and
    answers the whole stream.

    Playback ids are a stream's nested resource: `POST /live-streams/{id}/playback-ids`
    with a `policy` adds one (201, `{data: {id, policy}}`), it reads at
    `/live-streams/{id}/playback-ids/{playback_id}`, and `DELETE` there removes it
    (204); the stream's `playback_ids` then no longer hold it. `DELETE /live-streams/{id}`
    deletes the stream (204); it then answers 404.

    `GET /video/v1/live-streams` lists streams, paged by `limit`
    (default 25) and `page` (default 1; page `n` skips `(n - 1) * limit` streams), and
    filtered by `status` (`active`, `idle` or `disabled`) and `stream_key` (only the
    stream with that key).

    Errors answer `{error: {type, messages}}`: `type` is `invalid_parameters` (400)
    for a request that was refused, with `messages` naming the reasons,
    `unauthorized` (401), `not_found` (404) and `too_many_requests` (429).
servers:
  - url: https://api.mux.com
security:
  - accessToken: []
tags:
  - name: Live Streams
  - name: Playback IDs
paths:
  /video/v1/live-streams:
    get:
      tags: [Live Streams]
      operationId: list-live-streams
      summary: List live streams
      parameters:
        - {name: limit, in: query, description: Streams per page (default 25)., schema: {type: integer, minimum: 1, default: 25}}
        - {name: page, in: query, description: "The page; page n skips (n - 1) * limit streams.", schema: {type: integer, minimum: 1, default: 1}}
        - {name: stream_key, in: query, description: Only the stream with this key., schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [active, idle, disabled]}}
      responses:
        "200":
          description: A page of streams.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/LiveStream"}}
    post:
      tags: [Live Streams]
      operationId: create-live-stream
      summary: Create a live stream
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateLiveStreamRequest"}
      responses:
        "201":
          description: The created stream, idle.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LiveStreamResponse"}
        "400": {$ref: "#/components/responses/Error"}
  /video/v1/live-streams/{LIVE_STREAM_ID}:
    parameters:
      - $ref: "#/components/parameters/LIVE_STREAM_ID"
    get:
      tags: [Live Streams]
      operationId: get-live-stream
      summary: Retrieve a live stream
      responses:
        "200":
          description: The stream.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LiveStreamResponse"}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      tags: [Live Streams]
      operationId: update-live-stream
      summary: Update a live stream
      description: Sets the fields sent and keeps the rest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                passthrough: {type: string, maxLength: 255}
                latency_mode: {type: string, enum: [low, reduced, standard]}
                reconnect_window: {type: number, minimum: 0, maximum: 1800}
                max_continuous_duration: {type: integer, minimum: 60, maximum: 43200}
                meta: {type: object, properties: {title: {type: string, maxLength: 512}}}
      responses:
        "200":
          description: The updated stream.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LiveStreamResponse"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Live Streams]
      operationId: delete-live-stream
      summary: Delete a live stream
      responses:
        "204": {description: Deleted.}
        "404": {$ref: "#/components/responses/Error"}
  /video/v1/live-streams/{LIVE_STREAM_ID}/disable:
    parameters:
      - $ref: "#/components/parameters/LIVE_STREAM_ID"
    put:
      tags: [Live Streams]
      operationId: disable-live-stream
      summary: Disable a live stream
      description: "The stream's status becomes disabled; it refuses RTMP connections until enabled."
      responses:
        "200": {$ref: "#/components/responses/Empty"}
        "404": {$ref: "#/components/responses/Error"}
  /video/v1/live-streams/{LIVE_STREAM_ID}/enable:
    parameters:
      - $ref: "#/components/parameters/LIVE_STREAM_ID"
    put:
      tags: [Live Streams]
      operationId: enable-live-stream
      summary: Enable a live stream
      description: A disabled stream becomes idle again.
      responses:
        "200": {$ref: "#/components/responses/Empty"}
        "404": {$ref: "#/components/responses/Error"}
  /video/v1/live-streams/{LIVE_STREAM_ID}/reset-stream-key:
    parameters:
      - $ref: "#/components/parameters/LIVE_STREAM_ID"
    post:
      tags: [Live Streams]
      operationId: reset-stream-key
      summary: Reset a stream key
      description: A new stream_key replaces the old one.
      responses:
        "201":
          description: The stream with its new key.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LiveStreamResponse"}
        "404": {$ref: "#/components/responses/Error"}
  /video/v1/live-streams/{LIVE_STREAM_ID}/playback-ids:
    parameters:
      - $ref: "#/components/parameters/LIVE_STREAM_ID"
    post:
      tags: [Playback IDs]
      operationId: create-live-stream-playback-id
      summary: Create a playback id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                policy: {$ref: "#/components/schemas/PlaybackPolicy"}
                drm_configuration_id: {type: string}
      responses:
        "201":
          description: The new playback id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlaybackIdResponse"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /video/v1/live-streams/{LIVE_STREAM_ID}/playback-ids/{PLAYBACK_ID}:
    parameters:
      - $ref: "#/components/parameters/LIVE_STREAM_ID"
      - {name: PLAYBACK_ID, in: path, required: true, schema: {type: string}}
    get:
      tags: [Playback IDs]
      operationId: get-live-stream-playback-id
      summary: Retrieve a playback id
      responses:
        "200":
          description: The playback id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlaybackIdResponse"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [Playback IDs]
      operationId: delete-live-stream-playback-id
      summary: Delete a playback id
      responses:
        "204": {description: Deleted; the stream's playback_ids no longer hold it.}
        "404": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: basic
  parameters:
    LIVE_STREAM_ID:
      name: LIVE_STREAM_ID
      in: path
      required: true
      schema: {type: string}
  responses:
    Empty:
      description: Done.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {type: object}
    Error:
      description: "`{error: {type, messages}}`."
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  type: {type: string, example: not_found}
                  messages: {type: array, items: {type: string}}
  schemas:
    PlaybackPolicy:
      type: string
      enum: [public, signed, drm]
    PlaybackId:
      type: object
      properties:
        id: {type: string}
        policy: {$ref: "#/components/schemas/PlaybackPolicy"}
    PlaybackIdResponse:
      type: object
      properties:
        data: {$ref: "#/components/schemas/PlaybackId"}
    CreateLiveStreamRequest:
      type: object
      properties:
        playback_policies: {type: array, items: {$ref: "#/components/schemas/PlaybackPolicy"}}
        new_asset_settings:
          type: object
          properties:
            playback_policies: {type: array, items: {$ref: "#/components/schemas/PlaybackPolicy"}}
            passthrough: {type: string}
        reconnect_window: {type: number, minimum: 0, maximum: 1800, default: 60}
        latency_mode: {type: string, enum: [low, reduced, standard]}
        passthrough: {type: string, maxLength: 255}
        audio_only: {type: boolean}
        test: {type: boolean}
        max_continuous_duration: {type: integer, minimum: 60, maximum: 43200, default: 43200}
        meta: {type: object, properties: {title: {type: string, maxLength: 512}}}
    LiveStream:
      type: object
      properties:
        id: {type: string}
        created_at: {type: string, description: Unix time in seconds.}
        stream_key: {type: string, description: Secret; the encoder publishes with it.}
        active_asset_id: {type: string}
        recent_asset_ids: {type: array, items: {type: string}}
        status: {type: string, enum: [active, idle, disabled]}
        playback_ids: {type: array, items: {$ref: "#/components/schemas/PlaybackId"}}
        new_asset_settings: {type: object}
        passthrough: {type: string}
        audio_only: {type: boolean}
        reconnect_window: {type: number}
        latency_mode: {type: string, enum: [low, reduced, standard]}
        max_continuous_duration: {type: integer}
        test: {type: boolean}
        meta: {type: object, properties: {title: {type: string}}}
    LiveStreamResponse:
      type: object
      properties:
        data: {$ref: "#/components/schemas/LiveStream"}
