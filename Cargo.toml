[workspace]
resolver = "3"
members = ["crates/*", "examples/custom-ext"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rj-s-org/mockingbird"
version = "0.1.0-rc.1"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net"] }
axum = "0.8"
matchit = "0.9"
multer = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.0"
jsonschema = { version = "0.59", default-features = false }
rand = "0.10"
regex = "1.13"
async-trait = "0.1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
humantime = "2"
serde_urlencoded = "0.7"
tower-http = { version = "0.7", default-features = false, features = ["cors"] }
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
http = "1"
http-body = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
arc-swap = "1"
base64 = "0.23.1"
futures = "0.3.34"
eventsource-stream = "0.2.3"
async-graphql = { version = "7.2.1", default-features = false, features = ["dynamic-schema"] }
async-graphql-parser = "7.2.1"
tonic = "0.14.6"
tonic-reflection = "0.14.6"
tonic-health = "0.14.6"
tokio-stream = { version = "0.1.19", features = ["sync"] }
prost = "0.14.4"
prost-types = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.10.0"
quick-xml = "0.42.0"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
tar = "0.4.46"
flate2 = "1.1.10"
json-patch = { version = "4", default-features = false }
humantime-serde = "1"
cron = "0.17.0"
# Plain TCP only: the TLS features pull rustls-webpki 0.102, which has open
# advisories (MQTT over TLS is refused at config validation instead).
rumqttc = { version = "0.25.1", default-features = false }
lapin = "4.12.2"
rdkafka = { version = "0.39.0", default-features = false, features = ["cmake-build", "tokio", "libz-static", "ssl"] }
notify = "8"
notify-debouncer-full = "0.7"
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
subtle = "2"
hmac = "0.13"
rust-embed = { version = "8.13", features = ["debug-embed", "mime-guess"] }
openidconnect = { version = "4.0", default-features = false }
jsonwebtoken = { version = "11.1", features = ["aws_lc_rs"] }
rsa = { version = "0.9", features = ["pem"] }
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "script"] }
pdf-extract = "0.12.1"
weezl = "0.2.1"
scraper = "0.27"
pulldown-cmark = { version = "0.13", default-features = false }
url = "2.5"
ipnet = "2.12"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
time = "0.3.55"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "http1", "http2", "service"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["tls12"] }
rustls-native-certs = "0.8.5"
webpki-root-certs = "1.0.10"

# dev
wiremock = "0.6"
http-body-util = "0.1"
proptest = "1"
insta = { version = "1", features = ["yaml", "redactions"] }
tower = { version = "0.5", features = ["util"] }
assert_cmd = "2"
tempfile = "3"
tokio-tungstenite = "0.30"
rumqttd = { version = "0.20.0", default-features = false }

# internal
mb-mcm = { path = "crates/mb-mcm" }
mb-import = { path = "crates/mb-import" }
mb-llm = { path = "crates/mb-llm" }
mb-engine = { path = "crates/mb-engine" }
mb-state = { path = "crates/mb-state" }
mb-protocols = { path = "crates/mb-protocols" }
mb-ext = { path = "crates/mb-ext", version = "1.0.0" }
mb-store = { path = "crates/mb-store" }
mb-admin = { path = "crates/mb-admin" }
mb-auth = { path = "crates/mb-auth" }
mb-console = { path = "crates/mb-console" }

[workspace.lints.clippy]
unwrap_used = "deny"

# RSA key generation in the `testing` OIDC provider is very slow unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

# Full debuginfo made the ~50 workspace test binaries about 9.5 GB, enough to
# fill the disk mid-link (ld then dies with SIGBUS). Line tables keep file:line
# in backtraces for workspace code; dependencies carry no debuginfo.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
