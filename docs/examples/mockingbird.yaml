# Mockingbird configuration: every key, with its default where it has one.
# Precedence: this file < MB_* environment variables < command-line flags.
# Run with: mockingbird serve -c docs/examples/mockingbird.yaml [--watch]

server:
  host: 127.0.0.1          # MB_HOST / --host; non-loopback needs insecure_no_auth in auth.mode none
  port: 8080               # data plane; MB_PORT / --port
  admin_port: 9090         # Admin API and /healthz, /readyz, /metrics; MB_ADMIN_PORT / --admin-port
  grpc_port: 50051         # gRPC (h2c), shared by every gRPC mock; MB_GRPC_PORT / --grpc-port
  insecure_no_auth: false  # --insecure-no-auth
  # Secret references an LLM profile may use when it is created or updated
  # through the Admin API (globs, * = any characters). Anything else is a 422.
  # Profiles declared in this file are not restricted. Read at startup.
  api_secret_refs: ["env:MB_LLM_*", "env:*_API_KEY"]
  # role: all                       # all | control (Admin API, console, reconcile) | data (mocks only);
  #                                 # MB_ROLE / --role. control and data need a postgres:// storage.url
  #                                 # and a postgres:// or redis(s):// state store (never SQLite or memory)
  # trust_forwarded_headers: false  # trust X-Forwarded-* (only behind a proxy that sets them)
  # tls:                            # terminate TLS here; both files or neither, readable PEM at startup
  #   cert_file: /etc/mockingbird/tls/cert.pem
  #   key_file: /etc/mockingbird/tls/key.pem

storage:
  url: "sqlite::memory:"   # sqlite::memory:, sqlite://<path> or postgres://…; MB_STORAGE_URL / --storage-url
  state_url: memory        # session state; omitted = same as url; "memory" = in-process;
                           # also postgres://… or redis:// / rediss://…; MB_STATE_URL
  session_ttl: 24h

# Cross-node change bus (control → data nodes). MB_BUS_URL.
# bus:
#   url: redis://redis:6379   # redis://, rediss://, postgres://… or local (in-process);
#                             # omitted = Postgres LISTEN/NOTIFY when storage.url is Postgres, else local

# Outbound HTTP: LLM providers, the audit webhook, OIDC discovery.
# outbound:
#   ca_file: /etc/ssl/corp-ca.pem       # PEM bundle trusted in addition to the default roots
#   proxy: http://proxy.internal:3128   # http:// or https:// URL
#   no_proxy: [localhost, .internal]    # hosts, or domain suffixes, reached directly

# Global admission limits.
# limits:
#   max_concurrent_generations: 64   # LLM generations at once, all mocks (1-4096); more fall back to the faker
#   max_request_bytes: 1048576       # larger requests are 413 (1024-67108864)
#   max_response_bytes: 1048576      # larger generated responses fall back (1024-16777216)

# Output PII scrubber: replaces personal-data look-alikes in generated
# responses with synthetic values of the same shape.
# pii:
#   enabled: false
#   patterns: [email, phone, credit_card, us_ssn, iban, ipv4]   # default: all six
#   custom:                                                     # at most 32
#     - name: order_ref              # [a-z0-9_]{1,32}
#       regex: "ORD-[0-9]{6}"
#       replacement: "ORD-######"    # # = random digit, ? = random lowercase letter, else literal

auth:
  mode: none               # none (every admin request is a local sysadmin) | oidc
  # The URL browsers use to reach the admin port: the OIDC redirect is
  # <external_url>/auth/callback, https makes cookies Secure, and in oidc mode
  # the admin port answers only to this host (except /healthz, /readyz, /metrics).
  external_url: http://127.0.0.1:9090
  session_ttl: 12h         # absolute lifetime of a console login
  sysadmin_subjects: []    # OIDC `sub` values that are always sysadmin
  public_metrics: true     # false: /metrics needs credentials like the API
  oidc:                    # required in oidc mode
    issuer: http://localhost:8080/auth/v1
    client_id: mockingbird
    client_secret: env:MB_OIDC_CLIENT_SECRET   # a secret reference; omit for a public client
    scopes: [openid, profile, email, groups]
    roles_claim: groups    # claim holding <group_prefix>:<workspace>:<role> and <group_prefix>:sysadmin
    group_prefix: mb
    audience: mockingbird  # required `aud` of bearer JWTs; default: client_id

audit:
  retention_days: 365      # older audit events are pruned daily
  webhook_url: https://audit.example.com/mockingbird   # optional; every event is POSTed here
  webhook_secret: env:MB_AUDIT_WEBHOOK_SECRET          # secret reference; signs X-Mockingbird-Signature

llm:
  default_profile: deepseek   # used by mocks that name no profile; MB_LLM_* override profile "default"
  profiles:
    deepseek:
      workspace: default              # workspace the profile belongs to (created if missing)
      base_url: https://api.deepseek.com
      model: deepseek-chat
      api_key: env:DEEPSEEK_API_KEY   # a secret reference (env:NAME or file:/path), never the key itself
      json_schema: false
      timeout: 3s
      temperature: 0.7
      max_tokens: 2048
      fallback: local
    local:
      base_url: http://127.0.0.1:11434/v1
      model: llama3.2
      json_schema: true
      timeout: 10s
      temperature: 0.2
      max_tokens: 1024

observability:
  request_log_retention: 1000   # entries kept per mock
  # A key is redacted when, lowercased and without _ - . , it contains one of
  # these: token also hides access_token, refresh_token (and tokenizer_version).
  redact_fields: [password, token, secret, authorization, apiKey, api_key]

# Protocol settings shared by every mock. Read at startup.
protocols:
  graphql:
    path: /graphql          # GraphQL endpoint below each GraphQL mock's route prefix
    introspection: true
    max_depth: 15
    max_complexity: 1000
    # max_root_fields: 20                     # root fields per operation (1-1000)
    # max_subscriptions_per_connection: 16    # per WebSocket connection (1-1000)
    # max_connections_per_mock: 1000          # WebSocket connections per mock (1-100000)
    # connection_init_timeout: 5s             # close sockets with no connection_init (1s-10s)
  stream:                   # streamed responses: SSE, GraphQL subscriptions, gRPC streams
    default_items: 5        # items when the request asks for no count (X-Mockingbird-Stream-Items)
    max_items: 50
    item_interval: 0s       # pause between items (at most 30s)
  sse:
    keepalive: 15s          # interval between keepalive comments (at least 1s)
  grpc:
    max_message_bytes: 4194304   # largest message decoded or encoded (at least 1024)

# Message brokers the AsyncAPI mocks' channels publish to and consume from.
# Read at startup. kind: kafka | amqp | mqtt | memory (in-process, for tests).
# kafka needs bootstrap_servers; amqp and mqtt need url. Passwords never go
# in a url: put them in sasl.password as a secret reference.
brokers:
  local:
    kind: memory
  # kafka:
  #   kind: kafka
  #   bootstrap_servers: kafka-1:9092,kafka-2:9092   # comma-separated host:port list
  #   tls: true
  #   ca_file: /etc/ssl/kafka-ca.pem                 # trusted in addition to the system roots
  #   sasl:
  #     mechanism: SCRAM-SHA-512                     # PLAIN, SCRAM-SHA-256 or SCRAM-SHA-512
  #     username: mockingbird
  #     password: env:KAFKA_PASSWORD                 # a secret reference, never the password
  #   client_id_prefix: mockingbird                  # client ids; consumer group <prefix>-<mock>
  # rabbit:
  #   kind: amqp
  #   url: amqp://mockingbird@127.0.0.1:5672/%2f
  #   tls: false
  #   sasl: {mechanism: PLAIN, username: mockingbird, password: env:RABBIT_PASSWORD}
  # mosquitto:
  #   kind: mqtt
  #   url: mqtt://127.0.0.1:1883                     # plain MQTT only: mqtts://, ssl://, tls and ca_file
  #                                                  # are rejected (put a TLS-terminating proxy in front)
  # test:
  #   kind: memory                                   # in-process; nothing leaves Mockingbird

mocks:
  orders:
    workspace: default                                 # created if missing; mock names are unique per workspace
    contract: ../../fixtures/openapi/orders-3.0.yaml   # relative to this file
    route_prefix: /orders-api                          # default: /<name>
    persona: A small online shop selling hiking gear.
    llm_profile: deepseek                              # default: llm.default_profile
    header_overrides: true                             # honour X-Mockingbird-* request headers
    data_plane_auth:
      mode: none                                       # none | api_key | passthrough_validate
      header: x-api-key                                # where api_key mode reads the key (or ?api_key=)
    # chaos:                                           # fault injection; omitted = none
    #   error_rate: 0.1                                # 0-1: share of calls answering an injected error
    #   latency_jitter: {min: 50ms, max: 500ms}        # random added latency; min <= max <= 30s
    #   drop_stream_rate: 0.05                         # 0-1: share of streamed responses cut short
    # limits:                                          # omitted fields use the global limits (or none)
    #   rate_limit: {requests_per_second: 50, burst: 100}   # 429 with Retry-After beyond it
    #   daily_token_budget: 1000000                    # LLM tokens per UTC day, all replicas; then the faker
    #   max_request_bytes: 65536                       # overrides limits.max_request_bytes
    #   max_response_bytes: 262144                     # overrides limits.max_response_bytes
    scenarios:
      out-of-stock:
        instructions: Every product is out of stock.
        status: 409
        latency: 250ms
        set:
          status: pending
        operations: [createOrder]
      slow:
        latency: 2s
        # chaos: {error_rate: 0.5}                     # replaces the mock's chaos while the scenario applies
  events:
    contract: ../../fixtures/openapi/events-3.1.yaml   # GET /ticks streams server-sent events
    scenarios:
      trickle:
        stream_items: 3              # items per streamed response
        stream_item_interval: 500ms  # pause between streamed items (at most 30s)
  order-events:
    contract: ../../fixtures/asyncapi/orders-amqp-2.6.yaml   # AsyncAPI: event channels
    broker: local                    # a brokers: entry; default: picked automatically
    channels:                        # by channel id; channels not listed keep the contract's settings
      orderCreated:
        enabled: true                # false stops producing (or consuming) on the channel
        triggers:                    # omitted = the contract's triggers (manual when it has none)
          - every: 30s               # on a schedule (at least 100ms)
          - cron: "0 9 * * 1-5"      # 5-field (or 6-field, with seconds) cron expression, UTC
          - on_state_change:         # when the mock's state changes
              resource_type: orders
              kind: upserted         # upserted | deleted | any (default)
          - manual                   # on demand: mockingbird channels publish / the Admin API
      orderCancelled:
        enabled: false
