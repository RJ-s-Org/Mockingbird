# The world description of the orders mock in mockingbird.full.yaml
# (`mocks.orders.world`). Only the entries to set: the importer's
# heuristics fill in the rest. See docs/world.md.
version: 1
types:
  orders:
    # Answered on every read of an order, never stored (docs/world.md#expressions).
    computed:
      note: "'order of ' + record.customerId + ', ' + record.status"
operations:
  createOrder:
    # Expressions (docs/world.md#expressions): a new order starts pending,
    # and one over the limit is refused with the declared 400.
    set:
      status: "'pending'"
    refuse:
      - when: "request.body.total > 10000"
        status: 400
        message: {expr: "'an order total is at most 10000, not ' + string(request.body.total)"}
  listOrders:
    # A default status filter: shipped orders are listed only when the
    # request asks for a status (docs/world.md#expressions).
    list:
      where: "has(request.query.status) || it.status != 'shipped'"
  getOrder:
    not_found: 404
  deleteOrder:
    kind: delete
