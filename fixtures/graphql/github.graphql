# A GitHub-like subset of the GitHub GraphQL API, used as an importer fixture.

"""An object with an ID."""
interface Node {
  """ID of the object."""
  id: ID!
}

"""An ISO-8601 encoded UTC date string."""
scalar DateTime

"""The possible states of an issue."""
enum IssueState {
  """An issue that is still open."""
  OPEN
  """An issue that has been closed."""
  CLOSED
}

"""A user is an individual's account on GitHub."""
type User implements Node {
  id: ID!
  """The username used to login."""
  login: String!
  """The user's public profile name."""
  name: String
  createdAt: DateTime!
  """A list of repositories that the user owns."""
  repositories(first: Int = 10): [Repository!]!
}

"""A repository contains the content for a project."""
type Repository implements Node {
  id: ID!
  """The name of the repository."""
  name: String!
  """The User owner of the repository."""
  owner: User!
  """Identifies if the repository is private."""
  isPrivate: Boolean!
  """The number of stars."""
  stargazerCount: Int!
  """A list of issues that have been opened in the repository."""
  issues(states: [IssueState!], first: Int): [Issue!]!
}

"""An Issue is a place to discuss ideas, enhancements, tasks, and bugs."""
type Issue implements Node @key(fields: "id") {
  id: ID!
  """Identifies the issue number."""
  number: Int!
  """Identifies the issue title."""
  title: String!
  """Identifies the body of the issue."""
  body: String
  """Identifies the state of the issue."""
  state: IssueState!
  author: User
  repository: Repository!
  createdAt: DateTime!
}

extend type Issue {
  """Identifies the labels of the issue."""
  labels: [String!]!
}

"""The results of a search."""
union SearchResult = Repository | Issue | User

"""Autogenerated input type of CreateIssue."""
input CreateIssueInput {
  """The Node ID of the repository."""
  repositoryId: ID!
  """The title for the issue."""
  title: String!
  """The body for the issue description."""
  body: String
  """Labels to apply to the issue."""
  labels: [String!] = []
}

"""The query root of GitHub's GraphQL interface."""
type Query {
  """The currently authenticated user."""
  viewer: User!
  """Lookup a given repository by the owner and repository name."""
  repository(owner: String!, name: String!): Repository
  """Lookup an issue by its Node ID."""
  issue(id: ID!): Issue
  """Perform a search across resources."""
  search(query: String!, first: Int = 10): [SearchResult!]!
}

"""The root query for implementing GraphQL mutations."""
type Mutation {
  """Creates a new issue."""
  createIssue(input: CreateIssueInput!): Issue
  """Updates an Issue."""
  updateIssue(id: ID!, input: CreateIssueInput!): Issue
  """Deletes an Issue object."""
  deleteIssue(id: ID!): Issue
}

"""The root subscription type."""
type Subscription {
  """Emitted when an issue is opened in a repository."""
  issueAdded(repositoryId: ID!): Issue!
}
