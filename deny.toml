[graph]
all-features = true

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing attack affects private-key decryption; Mockingbird only verifies signatures (openidconnect) and signs in tests" },
    # crypto-bigint 0.5.5 (via openidconnect 4.0.1 -> p256/p384 -> elliptic-curve, used by mb-auth).
    # The fix is in 0.7.6, which openidconnect cannot take yet; revisit when it upgrades.
    { id = "RUSTSEC-2026-0385", reason = "non-constant-time mask generation and u128 comparisons in crypto-bigint 0.5.5: Mockingbird only verifies OIDC ID-token signatures (public values) through openidconnect; it never handles a private key in production, and no 0.5.x release has the fix" },
    { id = "RUSTSEC-2026-0387", reason = "timing variability in crypto-bigint 0.5.5 constant-time operations: same exposure as RUSTSEC-2026-0385, signature verification of public tokens only, and no 0.5.x release has the fix" },
    { id = "RUSTSEC-2026-0192", reason = "an unmaintained-crate notice, not a vulnerability: ttf-parser is a mandatory dependency of lopdf 0.42, pinned by pdf-extract 0.12.1 (the latest release; lopdf 0.45 drops ttf-parser but pdf-extract cannot use it). It is reachable only through smart-import PDF text extraction (mb-import feature `smart`), and only from lopdf's font embedding, which that extraction never calls" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "MIT-0",
]
# notify (required by the plan for --watch) is CC0-1.0, a public-domain
# dedication; allowed for that crate only rather than globally.
exceptions = [
    { allow = ["CC0-1.0"], crate = "notify" },
    # xxhash-rust is a mandatory dependency of redis (the Redis state backend
    # and bus); BSL-1.0 is a permissive, OSI-approved license.
    { allow = ["BSL-1.0"], crate = "xxhash-rust" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
