# Mockingbird with OIDC login through Rauthy, backed by Postgres.
#
#   docker compose -f deploy/compose/docker-compose.yml up --build
#
# Console: http://localhost:9090 (log in as demo@localhost.test /
# Demo-Passw0rd-123!), data plane: http://localhost:8080, Rauthy admin UI:
# http://localhost:8081/auth/v1/admin (admin@localhost.test).
#
# Optional profiles (see README.md) add to that default stack:
#
#   --profile ha     a control and a data node over Postgres + Redis
#                    (console http://localhost:19090, data plane http://localhost:18080)
#   --profile kafka  Kafka (localhost:9092; kafka:19092 inside the stack)
#   --profile amqp   RabbitMQ (localhost:5672, management UI http://localhost:15672)
#   --profile mqtt   Mosquitto (localhost:1883)
#
# DEVELOPMENT ONLY: every secret below is a published, well-known dev value.
# Never expose this stack beyond your machine or reuse these values.

name: mockingbird

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Rauthy with its embedded Hiqlite database. Mockingbird and the bootstrap
  # job share this container's network namespace, so `localhost:8081` is the
  # same issuer for the browser (through the published port) and for the
  # Mockingbird server; the Mockingbird ports are published here too.
  rauthy:
    image: ghcr.io/sebadob/rauthy:0.37.1
    environment:
      # Plain HTTP on 8081: the issuer is http://localhost:8081/auth/v1/ (Rauthy
      # always ends it with a slash; mockingbird.yaml must match it exactly).
      LISTEN_SCHEME: http
      LISTEN_PORT_HTTP: "8081"
      PUB_URL: localhost:8081
      # Required since there is no config.toml: Rauthy panics at startup with
      # "`webauthn.rp_id` is missing" / "`webauthn.rp_origin` is missing".
      # The origin must include the port.
      RP_ID: localhost
      RP_ORIGIN: http://localhost:8081
      COOKIE_MODE: danger-insecure
      # Rauthy's metrics listener defaults to 9090, Mockingbird's admin port.
      METRICS_ENABLE: "false"
      HQL_NODE_ID: "1"
      HQL_NODES: "1 localhost:8100 localhost:8200"
      HQL_SECRET_RAFT: dev-only-raft-secret-0123456789
      HQL_SECRET_API: dev-only-api-secret-0123456789
      ENC_KEYS: devkey1/wTFCH9cmlM1tYcnFJZ3HzTkVK3mKtuSSmqbvTAzVjik=
      ENC_KEY_ACTIVE: devkey1
      BOOTSTRAP_ADMIN_EMAIL: admin@localhost.test
      BOOTSTRAP_ADMIN_PASSWORD_PLAIN: Admin-Passw0rd-123!
      # base64 of {"name":"bootstrap","exp":null,"access":[{"group":"Clients"|"Groups"|"Users"|"Roles",
      #   "access_rights":["read","create","update","delete"]}, ...,
      #   {"group":"Secrets","access_rights":["read","update"]}]}
      # (Secrets: PUT /clients/{id}/secret needs Secrets/update.)
      BOOTSTRAP_API_KEY: 
      BOOTSTRAP_API_KEY_SECRET: pWZqB5bDOLJCI9hXxN4HNJsx417WaPv9oEFZQJqgrkz90VkC526TQSN6UgeIPxVQ
    volumes:
      - rauthy:/app/data
    ports:
      - "8081:8081" # Rauthy
      - "8080:8080" # Mockingbird data plane
      - "9090:9090" # Mockingbird console and Admin API

  # One-shot job: groups, the `mockingbird` client (its secret goes to the
  # `bootstrap` volume) and the demo user. Safe to run again. Rauthy's image is
  # distroless (no shell or curl), so it has no healthcheck; this job waits for
  # Rauthy's discovery document instead.
  rauthy-bootstrap:
    image: curlimages/curl:8.11.1
    network_mode: "service:rauthy"
    depends_on:
      rauthy:
        condition: service_started
    # root, so it can write to the freshly created (root-owned) volume.
    user: "0:0"
    entrypoint: ["/bin/sh", "/rauthy-bootstrap.sh"]
    environment:
      RAUTHY_URL: http://localhost:8081
      BOOTSTRAP_API_KEY_SECRET: pWZqB5bDOLJCI9hXxN4HNJsx417WaPv9oEFZQJqgrkz90VkC526TQSN6UgeIPxVQ
    volumes:
      - ./rauthy-bootstrap.sh:/rauthy-bootstrap.sh:ro
      - bootstrap:/bootstrap

  mockingbird:
    build: ../..
    image: mockingbird:local
    network_mode: "service:rauthy"
    depends_on:
      postgres:
        condition: service_healthy
      rauthy-bootstrap:
        condition: service_completed_successfully
    # --offline: the built-in faker only, so no LLM key is needed.
    command: ["serve", "-c", "/etc/mockingbird/mockingbird.yaml", "--host", "0.0.0.0", "--offline"]
    volumes:
      - ./mockingbird.yaml:/etc/mockingbird/mockingbird.yaml:ro
      - bootstrap:/bootstrap:ro

  # --- Profile `ha`: Mockingbird split into a control and a data node. ---
  # Both read mockingbird-ha.yaml (Postgres storage, Redis state and bus) and
  # differ only in --role. They use their own Postgres so they never share
  # mocks with the default `mockingbird` service (which uses the Postgres
  # bus), and they run without login (`auth.mode: none`), so keep the
  # published ports on your machine.
  postgres-ha:
    image: postgres:16
    profiles: [ha]
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-ha:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    profiles: [ha]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mockingbird-control:
    build: ../..
    image: mockingbird:local
    profiles: [ha]
    depends_on:
      postgres-ha:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["serve", "-c", "/etc/mockingbird/mockingbird.yaml", "--role", "control", "--offline"]
    volumes:
      - ./mockingbird-ha.yaml:/etc/mockingbird/mockingbird.yaml:ro
    ports:
      - "19090:9090" # console and Admin API

  mockingbird-data:
    build: ../..
    image: mockingbird:local
    profiles: [ha]
    depends_on:
      postgres-ha:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["serve", "-c", "/etc/mockingbird/mockingbird.yaml", "--role", "data", "--offline"]
    volumes:
      - ./mockingbird-ha.yaml:/etc/mockingbird/mockingbird.yaml:ro
    ports:
      - "18080:8080" # data plane
      - "15051:50051" # gRPC

  # --- Broker profiles for testing event channels (`brokers:` in mockingbird.yaml). ---
  kafka:
    image: apache/kafka:3.9.0
    profiles: [kafka]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL for the other containers (kafka:19092), EXTERNAL for the host
      # (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    profiles: [amqp]
    # RabbitMQ's `guest` may only connect from localhost, so a dev user for
    # the other containers.
    environment:
      RABBITMQ_DEFAULT_USER: mockingbird
      RABBITMQ_DEFAULT_PASS: mockingbird
    ports:
      - "5672:5672" # AMQP 0-9-1
      - "15672:15672" # management UI

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    profiles: [mqtt]
    # The image's bundled config: listener 1883, anonymous clients allowed.
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    ports:
      - "1883:1883"

volumes:
  postgres:
  rauthy:
  bootstrap:
  postgres-ha:
