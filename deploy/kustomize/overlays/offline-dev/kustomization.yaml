# Offline development: faker-only mocks (no LLM, no Secret, no egress) in
# their own namespace, with unknown ids answered 404.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mocks-dev
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: mockingbird-config
    behavior: merge
    files:
      - mockingbird.yaml
