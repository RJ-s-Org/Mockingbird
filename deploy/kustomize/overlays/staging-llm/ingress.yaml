apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mockingbird
spec:
  ingressClassName: nginx
  rules:
    - host: mocks.staging.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mockingbird
                port: {name: http}
