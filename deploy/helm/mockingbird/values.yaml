# Default values for the Mockingbird chart. See README.md for the reference.

image:
  repository: ghcr.io/rj-s-org/mockingbird
  # Defaults to the chart's appVersion.
  tag: ""
  # full: every protocol and broker client; slim: no broker clients (the tag
  # gets a `-slim` suffix).
  flavor: full
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# allInOne: one Deployment serving both planes (`--role all`).
# split: a control Deployment (console, Admin API, reconcile; leader-elected)
# and a data Deployment (the mocks; autoscaled). Split needs Postgres storage
# and Postgres or Redis state.
mode: allInOne

# mockingbird.yaml, deep-merged over files/default-config.yaml (later wins).
# `server.role` comes from `mode` (`--role`); do not set it here.
config: {}

# Mocks by name, merged into config.mocks (these win). Each entry is a
# `mocks.<name>` section of mockingbird.yaml (hosts, persona, llm_profile,
# scenarios, webhooks, ...: docs/configuration.md), except that `contract`
# also takes an object:
#   contract: {inline: "<the contract>", fileName: openapi.yaml}
#   contract: {configMap: {name: stripe-openapi, key: openapi.yaml}}
#   contract: {url: https://example.com/openapi.yaml, sha256: "<hex>"}
# A string stays a path (relative to /etc/mockingbird, or absolute).
mocks: {}
#  petstore:
#    contract:
#      inline: |
#        openapi: 3.0.3
#        ...
#    persona: A pet shop in Lisbon; Portuguese names.
#    scenarios:
#      out-of-stock: {status: 409, operations: [createOrder]}

# How a config change (mocks, contracts, config) reaches the pods.
#   rollout: the ConfigMap's checksum is a pod annotation, so `helm upgrade`
#     rolls the pods. ConfigMaps named by `contract.configMap` are not part
#     of the checksum: restart the pods after changing one.
#   watch: `serve --watch` on the all-in-one (or control) pods reconciles in
#     place once the kubelet syncs the ConfigMaps (usually within a minute);
#     the pods keep their sessions. Keys read at startup still need a restart.
reload: rollout

# Control-plane store -> MB_STORAGE_URL (required in split mode). Either a
# URL in the values, or a key of an existing Secret.
storage:
  url: ""
  existingSecret: ""
  existingSecretKey: url

# Session state store -> MB_STATE_URL (defaults to the storage URL).
state:
  url: ""
  existingSecret: ""
  existingSecretKey: url

# Cross-node change bus -> MB_BUS_URL (defaults to Postgres LISTEN/NOTIFY
# when storage is Postgres).
bus:
  url: ""
  existingSecret: ""
  existingSecretKey: url

# The `default` LLM profile: its key (MB_LLM_API_KEY) from an existing
# Secret, and its provider (MB_LLM_BASE_URL, MB_LLM_MODEL; empty keeps the
# built-in defaults). Without a key the mocks answer from the faker, offline.
llm:
  existingSecret: ""
  apiKeyKey: api-key
  baseUrl: ""
  model: ""
  # More profiles, merged into config.llm.profiles. Each is an
  # `llm.profiles.<name>` section of mockingbird.yaml; `apiKeySecret` puts the
  # key in MB_PROFILE_KEY_<NAME> and sets `api_key: env:MB_PROFILE_KEY_<NAME>`.
  profiles: {}
  #  openrouter:
  #    base_url: https://openrouter.ai/api/v1
  #    model: deepseek/deepseek-v4.1-flash-1017
  #    apiKeySecret: {name: openrouter, key: api-key}

# Extra environment variables and sources for every container.
env: []
envFrom: []

allInOne:
  replicas: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  topologySpreadConstraints: []

control:
  replicas: 2
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  topologySpreadConstraints: []

data:
  # Ignored while autoscaling is enabled.
  replicas: 2
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  topologySpreadConstraints: []
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  ports:
    http: 8080
    grpc: 50051
    admin: 9090

# HTTP mocks (REST, GraphQL, SOAP, SSE, WebSocket) on the data service.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mocks.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# gRPC mocks on the data service.
grpcIngress:
  enabled: false
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: GRPC
  hosts:
    - host: grpc.mocks.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# The console and the Admin API on the control (or all-in-one) service.
adminIngress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mockingbird.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  # Peers (NetworkPolicyPeer) allowed to reach the pods; empty allows any.
  ingressFrom: []
  # Egress rules (NetworkPolicyEgressRule); empty allows all egress.
  egress: []

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

serviceAccount:
  create: true
  # Defaults to the release's full name.
  name: ""
  annotations: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# `helm test`: a pod that checks /readyz on the admin service, then sends each
# request to the mocks service and expects its status.
tests:
  enabled: true
  requests: []
  #  - path: /petstore/pets
  #    method: GET
  #    status: 200
  #    headers: {X-Mockingbird-Session: helm-test}

# An image with sh and curl, for the fetch-contracts init container
# (`contract.url`) and the test pod.
curlImage:
  repository: curlimages/curl
  tag: "8.10.1"
  pullPolicy: IfNotPresent
