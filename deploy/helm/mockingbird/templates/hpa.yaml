{{- if and (eq .Values.mode "split") .Values.data.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "mockingbird.fullname" . }}-data
  labels:
    {{- include "mockingbird.labels" . | nindent 4 }}
    app.kubernetes.io/component: data
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "mockingbird.fullname" . }}-data
  minReplicas: {{ .Values.data.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.data.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.data.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
