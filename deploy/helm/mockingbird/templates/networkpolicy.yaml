{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mockingbird.fullname" . }}
  labels:
    {{- include "mockingbird.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mockingbird.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: http
          protocol: TCP
        - port: grpc
          protocol: TCP
        - port: admin
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
        # The release's own pods, including the `helm test` pod.
        - podSelector:
            matchLabels:
              {{- include "mockingbird.selectorLabels" $ | nindent 14 }}
      {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
